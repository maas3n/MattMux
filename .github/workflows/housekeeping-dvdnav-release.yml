name: DVDNav release housekeeping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/housekeeping-dvdnav-release.yml'

permissions:
  contents: write

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update future Android release payload and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/release.yml')
          text = path.read_text()

          old = """          python3 android/native/verify-package.py \"$APK\"\n          unzip -p \"$APK\" assets/ffmpeg/ffmpeg-build-info.txt | grep -q 'FFmpeg version: 9.0.1'\n          \"${ANDROID_HOME}/build-tools/36.0.0/zipalign\" -c -P 16 -v 4 \"$APK\"\n"""
          new = """          python3 android/native/verify-package.py \"$APK\"\n          unzip -p \"$APK\" assets/ffmpeg/ffmpeg-build-info.txt | grep -q 'FFmpeg version: 9.0.1'\n          unzip -p \"$APK\" assets/ffmpeg/ffmpeg-build-info.txt | grep -Fq 'Title discovery: libdvdnav 6.1.1 + libdvdread 6.1.3'\n          \"${ANDROID_HOME}/build-tools/36.0.0/zipalign\" -c -P 16 -v 4 \"$APK\"\n"""
          if old not in text:
              raise SystemExit('Android verification block changed; refusing blind patch')
          text = text.replace(old, new, 1)

          old = """          cp android/native/.work/libudfread-1.1.2-source.tar.gz dist/android-release/\n          cp android/app/src/main/assets/ffmpeg/LIBUDFREAD_COPYING.txt dist/android-release/\n          cp android/app/src/main/assets/ffmpeg/ffmpeg-build-info.txt dist/android-release/FFmpeg-build-info.txt\n"""
          new = """          cp android/native/.work/libudfread-1.1.2-source.tar.gz dist/android-release/\n          cp android/native/.work/libdvdread-6.1.3-source.tar.gz dist/android-release/\n          cp android/native/.work/libdvdnav-6.1.1-source.tar.gz dist/android-release/\n          cp android/app/src/main/assets/ffmpeg/LIBUDFREAD_COPYING.txt dist/android-release/\n          cp android/app/src/main/assets/ffmpeg/DVDREAD_COPYING.txt dist/android-release/\n          cp android/app/src/main/assets/ffmpeg/DVDNAV_COPYING.txt dist/android-release/\n          cp android/app/src/main/assets/ffmpeg/ffmpeg-build-info.txt dist/android-release/FFmpeg-build-info.txt\n"""
          if old not in text:
              raise SystemExit('Android release payload block changed; refusing blind patch')
          text = text.replace(old, new, 1)

          required = [
              'libdvdread-6.1.3-source.tar.gz',
              'libdvdnav-6.1.1-source.tar.gz',
              'DVDREAD_COPYING.txt',
              'DVDNAV_COPYING.txt',
              'Title discovery: libdvdnav 6.1.1 + libdvdread 6.1.3',
          ]
          for needle in required:
              if text.count(needle) != 1:
                  raise SystemExit(f'unexpected release workflow occurrence count for {needle!r}: {text.count(needle)}')

          path.write_text(text)
          PY

          rm -f tmp/dvdnav-beta-helper.sh
          git diff --check
          test ! -e tmp/dvdnav-beta-helper.sh
          grep -Fq 'cp android/native/.work/libdvdread-6.1.3-source.tar.gz dist/android-release/' .github/workflows/release.yml
          grep -Fq 'cp android/native/.work/libdvdnav-6.1.1-source.tar.gz dist/android-release/' .github/workflows/release.yml
          grep -Fq 'cp android/app/src/main/assets/ffmpeg/DVDREAD_COPYING.txt dist/android-release/' .github/workflows/release.yml
          grep -Fq 'cp android/app/src/main/assets/ffmpeg/DVDNAV_COPYING.txt dist/android-release/' .github/workflows/release.yml
          grep -Fq "Title discovery: libdvdnav 6.1.1 + libdvdread 6.1.3" .github/workflows/release.yml

      - name: Commit housekeeping changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release.yml tmp/dvdnav-beta-helper.sh
          git diff --cached --quiet && { echo 'No housekeeping changes to commit'; exit 1; }
          git commit -m 'Finalize DVDNav Android release packaging'
          git push origin HEAD:main
