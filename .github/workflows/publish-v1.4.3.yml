name: Publish MattMux 1.4.3

on:
  push:
    branches:
      - feature/advanced-merger

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 3c9582de0f19c0243a69f1b7484279f3f6339c8c
      RELEASE_TAG: v1.4.3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact main commit and create immutable tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          main_sha="$(git rev-parse origin/main)"
          test "$main_sha" = "$TARGET_SHA" || {
            echo "main moved: expected $TARGET_SHA, got $main_sha" >&2
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to replace it." >&2
            exit 1
          fi
          git tag "$RELEASE_TAG" "$TARGET_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Dispatch unified release for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(printf '{\"ref\":\"main\",\"inputs\":{\"tag\":\"%s\"}}' "$RELEASE_TAG")"
          curl --fail-with-body --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -d "$payload"
