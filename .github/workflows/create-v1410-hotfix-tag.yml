name: Create v1.4.10 hotfix tag

on:
  push:
    paths:
      - '.github/workflows/create-v1410-hotfix-tag.yml'

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact validated source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: 9e0ed8d4895e1600da7b64c042d9a916ff157701

      - name: Verify source and create hotfix tag
        env:
          EXPECTED_SHA: 9e0ed8d4895e1600da7b64c042d9a916ff157701
          TAG: v1.4.10
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to move it." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" "$EXPECTED_SHA" -m 'MattMux 1.4.10 hotfix'
          git push origin "refs/tags/$TAG"

      - name: Dispatch unified release for hotfix tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.4.10
