name: Publish approved MattMux 1.4.15
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1415.yml']
permissions:
  contents: write
  actions: write
  pull-requests: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: 9fec11ef81bf6faf6f0ad03f414e50dd7d1ab8ba
      - name: Require merged fix and successful platform checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9fec11ef81bf6faf6f0ad03f414e50dd7d1ab8ba
          gh api "repos/$GITHUB_REPOSITORY/pulls/52" \
            | jq -e '.merged == true and .head.sha == "9fec11ef81bf6faf6f0ad03f414e50dd7d1ab8ba"'
          for run in 36153388538 36153388447 36153388692 36153388463; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
              | jq -e '.head_sha == "9fec11ef81bf6faf6f0ad03f414e50dd7d1ab8ba" and .status == "completed" and .conclusion == "success"'
          done
      - name: Create immutable v1.4.15 tag
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.4.15 >/dev/null 2>&1; then
            echo 'v1.4.15 already exists; refusing to move it.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.4.15 -m 'MattMux 1.4.15: correct Android DVD main-title selection'
          git push origin refs/tags/v1.4.15
      - name: Start complete cross-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v1.4.15 -f tag=v1.4.15
