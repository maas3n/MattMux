name: Remove Android custom DVD parser

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-android-custom-dvd-parser.yml'

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: '30.0.16248370'
  MATTMUX_CI_VERSION_NAME: '0.0.0-dev'
  MATTMUX_CI_VERSION_CODE: '1'

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Android libdvdnav/libdvdread-only migration
        run: |
          set -euo pipefail
          python3 tmp/port_android_libdvd_plan.py
          git diff --check
          ! grep -R --line-number 'DvdIfoParser' android/app/src/main/java android/app/src/test || {
            echo 'Custom Android DVD parser reference remains' >&2
            exit 1
          }
          grep -Fq 'nativePlanDvdNav' android/native/mattmux_jni.c
          grep -Fq 'ifoOpen(dvd, 0)' android/native/mattmux_jni.c
          grep -Fq 'dvdnav_describe_title_chapters' android/native/mattmux_jni.c

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils curl patchelf xz-utils autoconf automake libtool pkg-config ffmpeg genisoimage libavformat-dev libavcodec-dev libavutil-dev
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;${ANDROID_NDK_VERSION}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build and validate Android DVD path
        run: |
          set -euo pipefail
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" bash android/native/build-ffmpeg-android.sh
          python3 -m pip install pycdlib==1.14.0
          bash android/native/tests/test-udf-source.sh "$PWD/android/native/.work/libudfread"
          bash android/native/tests/test-host-remux.sh "$PWD/android/native/.work/libudfread" "$RUNNER_TEMP/remux-parity"
          gradle -p android \
            -PMATTMUX_VERSION_NAME="${MATTMUX_CI_VERSION_NAME}" \
            -PMATTMUX_VERSION_CODE="${MATTMUX_CI_VERSION_CODE}" \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          python3 android/native/verify-package.py "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"

      - name: Commit validated Android-only source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/
          git diff --cached --quiet && { echo 'No Android changes to commit' >&2; exit 1; }
          git commit -m 'Use libdvdnav and libdvdread for Android DVD planning'
          git push origin HEAD:main
