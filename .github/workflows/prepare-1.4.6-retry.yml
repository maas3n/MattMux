name: Prepare MattMux 1.4.6 hotfix retry

on:
  push:
    branches:
      - hotfix/1.4.6-desktop-input-probing
    paths:
      - .github/workflows/prepare-1.4.6-retry.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/1.4.6-desktop-input-probing
          fetch-depth: 5

      - name: Verify clean v1.4.5 source base
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e dc43e37df47baee46384955b5f1512b7681f412e^{commit}
          git diff --exit-code dc43e37df47baee46384955b5f1512b7681f412e -- . \
            ':(exclude).github/workflows/prepare-1.4.6.yml' \
            ':(exclude).github/workflows/prepare-1.4.6-retry.yml' \
            ':(exclude).github/prepare-1.4.6.py'

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install Linux test prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ cmake ninja-build curl xz-utils file \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Apply 1.4.6 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/prepare-1.4.6.py
          gofmt -w \
            src/app_windows_2.go src/linux_core.go \
            src/advanced_merger.go src/advanced_merger_test.go \
            src/desktop_input_flags.go src/desktop_input_flags_test.go

      - name: Verify requested behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          w = Path('src/app_windows_2.go').read_text()
          l = Path('src/linux_core.go').read_text()
          m = Path('src/advanced_merger.go').read_text()
          assert 'appendDesktopDVDInput(args, t.Number, src)' in w
          assert 'appendDesktopDVDInput(args, title.Number, src)' in l
          assert 'appendDesktopRobustInput(args, s.Path)' in m
          assert 'appendDesktopRobustInput(args, chapters)' in m
          assert 'args = append(args, "-preindex", "1")' not in w[w.index('func remuxSelected'):]
          start = l.index('func remuxTitle')
          end = l.index('func runCommand', start)
          assert 'args = append(args, "-preindex", "1")' not in l[start:end]
          assert 'ReadDVDTitleCount' not in w
          assert 'ReadDVDTitleCount' not in l
          PY

      - name: Test Linux and compile Windows test binary
        shell: bash
        run: |
          set -euo pipefail
          cd src
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o /tmp/mattmux-windows-tests.exe .

      - name: Commit tested hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md docs/ADVANCED_MERGER.md \
            src/app_windows_2.go src/linux_core.go \
            src/advanced_merger.go src/advanced_merger_test.go \
            src/desktop_input_flags.go src/desktop_input_flags_test.go
          git commit -m 'Fix desktop mux input handling for 1.4.6'
          git push origin HEAD:hotfix/1.4.6-desktop-input-probing
