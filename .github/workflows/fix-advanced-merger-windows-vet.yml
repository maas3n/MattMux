name: Fix Advanced Merger Windows vet issue

on:
  push:
    branches:
      - feature/advanced-merger

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/advanced-merger
          fetch-depth: 0

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Patch Win32 notification handling
        shell: pwsh
        run: |
          $path = 'src/app_windows_1.go'
          $text = Get-Content -Raw $path
          $old = @'
          	case 0x004e:
          		header := (*mergerNotifyHeader)(unsafe.Pointer(lParam))
          		if header.From == mergerWindow.tab && header.Code == -551 {
          			showMergerWindowsTab()
          			return 0
          		}
          '@
          $new = @'
          	case 0x004e:
          		var header mergerNotifyHeader
          		kernel32.NewProc("RtlMoveMemory").Call(uintptr(unsafe.Pointer(&header)), lParam, unsafe.Sizeof(header))
          		if header.From == mergerWindow.tab && header.Code == -551 {
          			showMergerWindowsTab()
          			return 0
          		}
          '@
          if (-not $text.Contains($old.Trim())) { throw 'Expected WM_NOTIFY block not found' }
          $text = $text.Replace($old.Trim(), $new.Trim())
          Set-Content -NoNewline -Encoding utf8 $path $text
          gofmt -w $path

      - name: Verify Windows tests and vet
        working-directory: src
        shell: pwsh
        run: |
          go test ./...
          go vet ./...

      - name: Commit fix and remove helper
        shell: pwsh
        run: |
          Remove-Item .github/workflows/fix-advanced-merger-windows-vet.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Windows Advanced Merger tab notification handling"
          git push origin HEAD:feature/advanced-merger
