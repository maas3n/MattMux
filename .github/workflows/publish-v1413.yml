name: Publish approved MattMux 1.4.13
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1413.yml']
permissions:
  contents: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: bb1edfcfd30d0dec69e100659a1f21fa7155e92c
      - name: Verify all three CI gates for the release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bb1edfcfd30d0dec69e100659a1f21fa7155e92c
          for run in 35130546670 35130546681 35130546669; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > /tmp/mattmux-ci.json
            jq -e '.head_sha == "bb1edfcfd30d0dec69e100659a1f21fa7155e92c" and .status == "completed" and .conclusion == "success"' /tmp/mattmux-ci.json
          done
      - name: Create immutable v1.4.13 tag
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.4.13 >/dev/null 2>&1; then
            echo "v1.4.13 already exists; refusing to move it." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.4.13 -m 'MattMux 1.4.13: Android CLI streams, single-ISO sibling output and reliable native symbol checks'
          git push origin refs/tags/v1.4.13
      - name: Start complete cross-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.4.13
