name: Publish approved MattMux 1.4.11
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1411.yml']
permissions:
  contents: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: c2d89f7f59ba7e4608fc756b3c2462aa490990ce
      - name: Verify all three CI gates for the release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c2d89f7f59ba7e4608fc756b3c2462aa490990ce
          for run in 34914790756 34914790800 34914790749; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > /tmp/mattmux-ci.json
            jq -e '.head_sha == "c2d89f7f59ba7e4608fc756b3c2462aa490990ce" and .status == "completed" and .conclusion == "success"' /tmp/mattmux-ci.json
          done
      - name: Create immutable v1.4.11 tag
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.4.11 >/dev/null 2>&1; then
            echo "v1.4.11 already exists; refusing to move it." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.4.11 -m 'MattMux 1.4.11: desktop and Android DVD ISO, batch and CLI parity'
          git push origin refs/tags/v1.4.11
      - name: Start complete cross-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.4.11
