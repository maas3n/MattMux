name: Publish approved MattMux 1.4.19
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1419.yml']
permissions:
  contents: write
  actions: write
  pull-requests: read
concurrency:
  group: publish-approved-v1419
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: 56555e6e70528c5a255f8b4cb8ac6f8a00081e22
      - name: Require merged source and successful platform checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 56555e6e70528c5a255f8b4cb8ac6f8a00081e22
          gh api "repos/$GITHUB_REPOSITORY/pulls/58" \
            | jq -e '.merged == true and .head.sha == "13f3aa1038cba46ecb875ad706a543fe94d1f6d7" and .merge_commit_sha == "56555e6e70528c5a255f8b4cb8ac6f8a00081e22"'
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse 13f3aa1038cba46ecb875ad706a543fe94d1f6d7^{tree})"
          for run in 36961917138 36961917153 36961917141 36961917379; do
            completed=false
            for attempt in $(seq 1 160); do
              result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")"
              jq -e '.head_sha == "13f3aa1038cba46ecb875ad706a543fe94d1f6d7"' <<<"$result"
              if [ "$(jq -r .status <<<"$result")" = completed ]; then
                jq -e '.conclusion == "success"' <<<"$result"
                completed=true
                break
              fi
              sleep 30
            done
            test "$completed" = true
          done
      - name: Create immutable v1.4.19 tag
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.4.19 >/dev/null 2>&1; then
            echo 'v1.4.19 already exists; refusing to move it.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.4.19 -m 'MattMux 1.4.19: direct DVD demux, Advanced Merger DEMUX and refreshed README'
          git push origin refs/tags/v1.4.19
      - name: Start complete cross-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v1.4.19 -f tag=v1.4.19
