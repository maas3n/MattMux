name: Android DVD title regression
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-dvd-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-titles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install fixture and host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config ffmpeg dvdauthor genisoimage libavformat-dev libavcodec-dev libavutil-dev
      - name: Get pinned DVD libraries
        run: |
          mkdir -p "$RUNNER_TEMP/dvd-sources"
          git clone --depth 1 --branch 6.1.3 https://code.videolan.org/videolan/libdvdread.git "$RUNNER_TEMP/dvd-sources/libdvdread"
          git clone --depth 1 --branch 6.1.1 https://code.videolan.org/videolan/libdvdnav.git "$RUNNER_TEMP/dvd-sources/libdvdnav"
          git clone --depth 1 --branch 1.1.2 https://code.videolan.org/videolan/libudfread.git "$RUNNER_TEMP/dvd-sources/libudfread"
          (cd "$RUNNER_TEMP/dvd-sources/libdvdread" && autoreconf -fi)
          (cd "$RUNNER_TEMP/dvd-sources/libdvdnav" && autoreconf -fi)
      - name: Verify production scan, plan and main-movie payloads
        run: bash android/native/tests/test-title-selection.sh "$RUNNER_TEMP/dvd-sources" "$RUNNER_TEMP/title-selection"
      - name: Prove the regression catches v1.4.14
        run: |
          git show v1.4.14:android/native/mattmux_jni.c > "$RUNNER_TEMP/released-jni.c"
          if TITLE_JNI_SOURCE="$RUNNER_TEMP/released-jni.c" bash android/native/tests/test-title-selection.sh "$RUNNER_TEMP/dvd-sources" "$RUNNER_TEMP/title-baseline" > "$RUNNER_TEMP/baseline.log" 2>&1; then
            echo 'Regression unexpectedly accepted the old release' >&2
            exit 1
          fi
          grep -F 'Wrong longest title' "$RUNNER_TEMP/baseline.log"
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dvd-title-regression
          path: |
            ${{ runner.temp }}/title-selection/*.fingerprint.json
            ${{ runner.temp }}/baseline.log
