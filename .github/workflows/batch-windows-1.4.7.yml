name: Batch 1.4.7 Windows validation

on:
  push:
    branches:
      - feature/batch-1.4.7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install FFmpeg for integration tests
        run: choco install ffmpeg --no-progress -y

      - name: Test and vet Windows GUI batch integration
        working-directory: src
        run: |
          go test ./...
          go vet ./...

      - name: Build Windows GUI
        shell: pwsh
        working-directory: src
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -buildvcs=false -ldflags "-s -w -H=windowsgui" -o ..\MattMux.exe .
          if (-not (Test-Path ..\MattMux.exe)) { throw 'MattMux.exe missing' }

      - name: Build and smoke-test Windows batch CLI
        shell: pwsh
        working-directory: src
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=1.4.7-dev" -o ..\mattmux-cli.exe .\cmd\mattmux-cli-windows
          & ..\mattmux-cli.exe --version
          $help = (& ..\mattmux-cli.exe 2>&1 | Out-String)
          if (-not $help.Contains('--batch')) { throw 'batch CLI help missing' }

      - name: Upload validation binaries
        uses: actions/upload-artifact@v4
        with:
          name: MattMux-1.4.7-Windows-batch-validation
          path: |
            MattMux.exe
            mattmux-cli.exe
          if-no-files-found: error
