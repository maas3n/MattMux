name: Apply remaining review fixes

on:
  push:
    branches: [fix/release-audit-2026-09-11]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-audit-2026-09-11
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Apply remaining review fixes
        run: |
          python3 tools/apply_remaining_review_fixes.py
          gofmt -w src/output_finalize_linux.go src/linux_core.go src/app_windows_2.go src/release_audit_output_linux_test.go src/release_audit_cli_signal_linux_test.go
      - name: Test Linux and Windows source
        shell: bash
        run: |
          set -euo pipefail
          pushd src >/dev/null
          go mod tidy
          go test ./...
          go test -tags cli ./...
          go vet ./...
          go vet -tags cli ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o /tmp/mattmux-windows.test .
          popd >/dev/null
          bash -n packaging/linux/build-linux-release.sh
          dpkg --compare-versions '1.4.1~alpha.1' lt '1.4.1~beta.1'
          dpkg --compare-versions '1.4.1~beta.1' lt '1.4.1~rc.1'
          dpkg --compare-versions '1.4.1~rc.1' lt '1.4.1'
          dpkg --compare-versions '1.4.1' lt '1.4.2~alpha.1'
          test ! -e tools/__pycache__/apply-track-selection.cpython-312.pyc
          git diff --check
      - name: Commit and push tested remaining fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/output_finalize_linux.go src/linux_core.go src/app_windows_2.go src/app_windows_4.go src/release_audit_output_linux_test.go src/release_audit_cli_signal_linux_test.go src/go.mod src/go.sum .gitignore README.md RELEASING.md CHANGELOG.md android/README.md
          git diff --cached --check
          git commit -m 'Complete release audit fixes and regression coverage'
          git push origin HEAD:fix/release-audit-2026-09-11
