name: Apply review fixes

on:
  push:
    branches:
      - fix/release-audit-2026-09-11

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-audit-2026-09-11
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def repl(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              p.write_text(text.replace(old, new, count))

          # Keep FFmpeg stream discovery consistent between probing and remuxing.
          probe_old = 'args := []string{"-hide_banner", "-nostdin", "-y", "-f", "dvdvideo", "-title", strconv.Itoa('
          probe_new = 'args := []string{"-hide_banner", "-nostdin", "-y", "-probesize", "100M", "-analyzeduration", "100M", "-f", "dvdvideo", "-title", strconv.Itoa('
          repl('src/linux_core.go', probe_old, probe_new)
          repl('src/app_windows_2.go', probe_old, probe_new)

          # A successful Linux remux must remain recoverable if publication fails.
          repl('src/linux_core.go', '\tdefer os.Remove(partial)\n', '\tcleanupPartial := true\n\tdefer func() {\n\t\tif cleanupPartial {\n\t\t\t_ = os.Remove(partial)\n\t\t}\n\t}()\n')
          repl('src/linux_core.go', '\tif err := finalizeRemuxOutput(partial, final); err != nil {\n\t\treturn "", err\n\t}\n', '\tif err := validateAndSyncOutput(partial); err != nil {\n\t\treturn "", err\n\t}\n\tif err := commitOutputNoReplace(partial, final); err != nil {\n\t\tcleanupPartial = false\n\t\treturn "", fmt.Errorf("%w; completed MKV retained at %s", err, partial)\n\t}\n\tif err := syncDirectory(filepath.Dir(final)); err != nil {\n\t\treturn "", fmt.Errorf("output committed to %s but directory sync failed: %w", final, err)\n\t}\n')

          # Ctrl+C and SIGTERM now cancel through context so owned partials are removed.
          repl('src/main_linux_cli.go', '\t"os"\n\t"path/filepath"\n', '\t"os"\n\t"os/signal"\n\t"path/filepath"\n')
          repl('src/main_linux_cli.go', '\t"strings"\n)\n', '\t"strings"\n\t"syscall"\n)\n')
          repl('src/main_linux_cli.go', '\tctx := context.Background()\n', '\tctx, stop := signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)\n\tdefer stop()\n')

          # Debian prereleases must sort before the corresponding stable version.
          repl('packaging/linux/build-linux-release.sh', 'APP_VERSION="${1:-1.3.0-dev5}"\nDEB_VERSION="${APP_VERSION/-dev/~dev}"\n', 'APP_VERSION="${1:-1.3.0-dev5}"\nDEB_VERSION="$APP_VERSION"\ncase "$DEB_VERSION" in\n  *-alpha.*) DEB_VERSION="${DEB_VERSION/-alpha./~alpha.}" ;;\n  *-beta.*)  DEB_VERSION="${DEB_VERSION/-beta./~beta.}" ;;\n  *-rc.*)    DEB_VERSION="${DEB_VERSION/-rc./~rc.}" ;;\n  *-dev*)    DEB_VERSION="${DEB_VERSION/-dev/~dev}" ;;\nesac\n')
          repl('packaging/linux/build-linux-release.sh', 'Depends: libc6, libstdc++6, libgcc-s1, ca-certificates, libgl1, libx11-6, libxcursor1, libxrandr2, libxinerama1, libxi6, libxkbcommon0, libwayland-client0\n', 'Depends: libc6 (>= 2.38), libstdc++6, libgcc-s1, ca-certificates, libgl1, libx11-6, libxcursor1, libxrandr2, libxinerama1, libxi6, libxkbcommon0, libwayland-client0\n')

          # Preserve a completed Android output if document-provider rename fails.
          repl('android/app/src/main/java/io/github/maas3n/mattmux/DvdDocumentSource.kt', '        return DocumentsContract.renameDocument(resolver, pending.uri, pending.finalName)\n            ?: error("Remux completed, but the output provider could not rename the temporary file")\n    }\n\n    fun abort(pending: Pending) {\n', '        return DocumentsContract.renameDocument(resolver, pending.uri, pending.finalName)\n            ?: error("Remux completed, but the output provider could not rename the temporary file. Completed MKV kept at ${pending.uri}")\n    }\n\n    fun preserve(pending: Pending) {\n        runCatching { pending.descriptor.close() }\n    }\n\n    fun abort(pending: Pending) {\n')
          repl('android/app/src/main/java/io/github/maas3n/mattmux/RemuxEngine.kt', '            val pending = output.create(title.plan.globalTitle)\n            try {\n', '            val pending = output.create(title.plan.globalTitle)\n            var remuxCompleted = false\n            try {\n')
          repl('android/app/src/main/java/io/github/maas3n/mattmux/RemuxEngine.kt', '                if (nativeError != null) {\n                    throw IllegalStateException(nativeError)\n                }\n                check(!cancelled.get()) { "Remux cancelled" }\n', '                if (nativeError != null) {\n                    throw IllegalStateException(nativeError)\n                }\n                remuxCompleted = true\n                check(!cancelled.get()) { "Remux cancelled" }\n')
          repl('android/app/src/main/java/io/github/maas3n/mattmux/RemuxEngine.kt', '            } catch (t: Throwable) {\n                output.abort(pending)\n                throw t\n            }\n', '            } catch (t: Throwable) {\n                if (remuxCompleted) output.preserve(pending) else output.abort(pending)\n                throw t\n            }\n')

          # Unified release APKs must use the persistent Android upload key.
          release = Path('.github/workflows/release.yml')
          text = release.read_text()
          anchor = "      - name: Set up Gradle 9.6\n        uses: gradle/actions/setup-gradle@v4\n        with:\n          gradle-version: '9.6.0'\n\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'release.yml: expected one Gradle setup block, found {text.count(anchor)}')
          gh = '$' + '{{'
          close = '}}'
          signing = anchor + "      - name: Require Android distribution signing secrets\n        env:\n          KEYSTORE_B64: " + gh + " secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 " + close + "\n          STORE_PASSWORD: " + gh + " secrets.ANDROID_UPLOAD_STORE_PASSWORD " + close + "\n          KEY_ALIAS: " + gh + " secrets.ANDROID_UPLOAD_KEY_ALIAS " + close + "\n          KEY_PASSWORD: " + gh + " secrets.ANDROID_UPLOAD_KEY_PASSWORD " + close + "\n        run: |\n          set -euo pipefail\n          test -n \"$KEYSTORE_B64\" || { echo 'Missing ANDROID_UPLOAD_KEYSTORE_BASE64' >&2; exit 1; }\n          test -n \"$STORE_PASSWORD\" || { echo 'Missing ANDROID_UPLOAD_STORE_PASSWORD' >&2; exit 1; }\n          test -n \"$KEY_ALIAS\" || { echo 'Missing ANDROID_UPLOAD_KEY_ALIAS' >&2; exit 1; }\n          test -n \"$KEY_PASSWORD\" || { echo 'Missing ANDROID_UPLOAD_KEY_PASSWORD' >&2; exit 1; }\n\n      - name: Prepare Android distribution keystore\n        env:\n          KEYSTORE_B64: " + gh + " secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 " + close + "\n        run: |\n          set -euo pipefail\n          printf '%s' \"$KEYSTORE_B64\" | base64 --decode > \"${RUNNER_TEMP}/mattmux-upload.jks\"\n          test -s \"${RUNNER_TEMP}/mattmux-upload.jks\"\n\n"
          text = text.replace(anchor, signing, 1)
          old_build = "      - name: Test, lint and build versioned APK\n        run: |\n          gradle -p android \\\n            -PMATTMUX_VERSION_NAME='" + gh + " needs.metadata.outputs.version " + close + "' \\\n            -PMATTMUX_VERSION_CODE='" + gh + " needs.metadata.outputs.android_version_code " + close + "' \\\n            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug\n"
          new_build = "      - name: Test, lint and build signed versioned APK\n        env:\n          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_STORE_FILE: " + gh + " runner.temp " + close + "/mattmux-upload.jks\n          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_STORE_PASSWORD: " + gh + " secrets.ANDROID_UPLOAD_STORE_PASSWORD " + close + "\n          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_KEY_ALIAS: " + gh + " secrets.ANDROID_UPLOAD_KEY_ALIAS " + close + "\n          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_KEY_PASSWORD: " + gh + " secrets.ANDROID_UPLOAD_KEY_PASSWORD " + close + "\n        run: |\n          gradle -p android \\\n            -PMATTMUX_VERSION_NAME='" + gh + " needs.metadata.outputs.version " + close + "' \\\n            -PMATTMUX_VERSION_CODE='" + gh + " needs.metadata.outputs.android_version_code " + close + "' \\\n            :app:testDebugUnitTest :app:lintRelease :app:assembleRelease\n"
          if old_build not in text:
              raise SystemExit('release.yml: Android build block changed')
          text = text.replace(old_build, new_build, 1)
          if text.count('android/app/build/outputs/apk/debug') != 2:
              raise SystemExit('release.yml: expected two debug APK paths')
          text = text.replace('android/app/build/outputs/apk/debug', 'android/app/build/outputs/apk/release')
          verify = '          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"\n'
          if text.count(verify) != 1:
              raise SystemExit('release.yml: zipalign verification line changed')
          text = text.replace(verify, verify + '          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/mattmux-apksigner.txt\n          ! grep -Fq "CN=Android Debug" /tmp/mattmux-apksigner.txt\n', 1)
          release.write_text(text)

          # Regression: destination collision must retain the completed Linux partial.
          test = Path('src/release_audit_output_linux_test.go')
          text = test.read_text()
          anchor = '\tif err == nil || string(b) != "other writer" {\n\t\tt.Fatalf("destination collision: final=%s err=%v content=%q", f, err, b)\n\t}\n'
          addition = anchor + '\tentries, readErr := os.ReadDir(out)\n\tif readErr != nil {\n\t\tt.Fatal(readErr)\n\t}\n\tvar recovered []byte\n\tfor _, entry := range entries {\n\t\tif strings.HasSuffix(entry.Name(), ".partial.mkv") {\n\t\t\trecovered, readErr = os.ReadFile(filepath.Join(out, entry.Name()))\n\t\t\tif readErr != nil {\n\t\t\t\tt.Fatal(readErr)\n\t\t\t}\n\t\t}\n\t}\n\tif string(recovered) != "new output" {\n\t\tt.Fatalf("completed remux was not retained after publication collision: %q", recovered)\n\t}\n'
          if text.count(anchor) != 1:
              raise SystemExit('Linux collision test block changed')
          test.write_text(text.replace(anchor, addition, 1))
          PY

          gofmt -w src/linux_core.go src/main_linux_cli.go src/app_windows_2.go src/release_audit_output_linux_test.go

      - name: Test desktop fixes
        shell: bash
        run: |
          set -euo pipefail
          pushd src >/dev/null
          go test ./...
          go test -tags cli ./...
          go vet ./...
          go vet -tags cli ./...
          popd >/dev/null
          bash -n packaging/linux/build-linux-release.sh
          dpkg --compare-versions '1.4.1~alpha.1' lt '1.4.1~beta.1'
          dpkg --compare-versions '1.4.1~beta.1' lt '1.4.1~rc.1'
          dpkg --compare-versions '1.4.1~rc.1' lt '1.4.1'
          grep -Fq 'libc6 (>= 2.38)' packaging/linux/build-linux-release.sh
          git diff --check

      - name: Commit tested fixes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix release audit findings'
          git push origin HEAD:fix/release-audit-2026-09-11
