name: Release Android / ChromeOS alpha

on:
  push:
    branches:
      - android-chromeos
    paths:
      - '.github/ANDROID_ALPHA_RELEASE'
  workflow_dispatch:

permissions:
  contents: write

env:
  FFMPEG_VERSION: '9.0.1'
  ANDROID_NDK_VERSION: '30.0.16248370'
  RELEASE_TAG: 'v1.2.0-chromeos-alpha4'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils curl patchelf xz-utils autoconf automake libtool pkg-config ffmpeg genisoimage libavformat-dev libavcodec-dev libavutil-dev
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build bundled LGPL FFmpeg runtime
        run: |
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            bash android/native/build-ffmpeg-android.sh

      - name: Test UDF reads and production JNI remux parity
        run: |
          python3 -m pip install pycdlib==1.14.0
          bash android/native/tests/test-udf-source.sh "$PWD/android/native/.work/libudfread"
          bash android/native/tests/test-host-remux.sh "$PWD/android/native/.work/libudfread" "$RUNNER_TEMP/remux-parity"

      - name: Upload remux parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remux-parity-${{ github.run_id }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/remux-parity/*.fingerprint.json

      - name: Test, lint and build APK
        run: |
          gradle -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify APK version and bundled native libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "${APK}"

          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "${APK}")"
          grep -Fq "versionCode='104'" <<<"${BADGING}"
          grep -Fq "versionName='1.2.0-chromeos-alpha4'" <<<"${BADGING}"

          python3 android/native/verify-package.py "${APK}"

          unzip -p "${APK}" assets/ffmpeg/ffmpeg-build-info.txt \
            | grep -q 'FFmpeg version: 9.0.1'

          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" \
            -c -P 16 -v 4 "${APK}"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          cp "${APK}" dist/MattMux-1.2.0-ChromeOS-Alpha4.apk
          cp android/native/.work/ffmpeg-${FFMPEG_VERSION}.tar.xz \
            dist/FFmpeg-${FFMPEG_VERSION}-source.tar.xz
          cp android/native/.work/libudfread-1.1.2-source.tar.gz dist/
          cp android/app/src/main/assets/ffmpeg/LIBUDFREAD_COPYING.txt dist/
          cp android/app/src/main/assets/ffmpeg/ffmpeg-build-info.txt \
            dist/libudfread-1.1.2-source.tar.gz
            dist/LIBUDFREAD_COPYING.txt
            dist/FFmpeg-build-info.txt
          cp android/app/src/main/assets/ffmpeg/COPYING.LGPLv2.1 \
            dist/COPYING.LGPLv2.1.txt
          cp android/app/src/main/assets/ffmpeg/FFMPEG_LICENSE.md \
            dist/FFMPEG_LICENSE.md

          (
            cd dist
            sha256sum \
              MattMux-1.2.0-ChromeOS-Alpha4.apk \
              FFmpeg-${FFMPEG_VERSION}-source.tar.xz \
              libudfread-1.1.2-source.tar.gz \
              LIBUDFREAD_COPYING.txt \
              FFmpeg-build-info.txt \
              COPYING.LGPLv2.1.txt \
              FFMPEG_LICENSE.md \
              > SHA256SUMS.txt
          )

          cat > dist/RELEASE_NOTES.md <<'EOF'
          # MattMux 1.2.0 ChromeOS Alpha 4

          Experimental DVD remux build for Android and ChromeOS.

          Changes since Alpha 3:
          - native VIDEO_TS stream-copy remuxing through the IFO/title/cell planner;
          - read-only UDF ISO access through a separately linked LGPL libudfread;
          - the same planner and cell-span input for folders and ISO files;
          - cancellation, bounded input validation, temporary output and flush checks;
          - corrected BCD fixtures and source-independent DVD plan diagnostics.

          Full Linux/Windows output parity and physical Chromebook validation are not yet established.
          Interleaved multi-angle discs are rejected until NAV/VOBU-aware selection is implemented.
          Still-time, shuffle and multi-PGC layouts remain unsupported. Encrypted VOBs are not decrypted.
          ISO9660-only images and non-seekable storage providers are unsupported.
          Purchases remain disabled. This is not a production Play release.

          This self-contained APK includes LGPL FFmpeg 9.0.1 and libudfread 1.1.2 for arm64-v8a and x86_64.
          It uses an Android debug signing key for testing. The exact library sources, notices,
          build provenance and checksums accompany the APK. No libdvdread, libdvdnav or libdvdcss is bundled.
          EOF

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=(
            dist/MattMux-1.2.0-ChromeOS-Alpha4.apk
            dist/FFmpeg-${FFMPEG_VERSION}-source.tar.xz
            dist/libudfread-1.1.2-source.tar.gz
            dist/LIBUDFREAD_COPYING.txt
            dist/FFmpeg-build-info.txt
            dist/COPYING.LGPLv2.1.txt
            dist/FFMPEG_LICENSE.md
            dist/SHA256SUMS.txt
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Refusing to replace ${RELEASE_TAG} assets: tag points to $tag_sha but this build is $GITHUB_SHA." >&2
              echo "Bump the alpha version instead of publishing different source under the same tag." >&2
              exit 1
            fi
            echo "Release already exists; refusing to replace published binaries." >&2
            exit 1
          else
            gh release create "${RELEASE_TAG}" "${ASSETS[@]}" \
              --target "${GITHUB_SHA}" \
              --title 'MattMux 1.2.0 ChromeOS Alpha 4' \
              --notes-file dist/RELEASE_NOTES.md \
              --prerelease
          fi
