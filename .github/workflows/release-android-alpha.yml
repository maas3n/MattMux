name: Release Android / ChromeOS alpha

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FFMPEG_VERSION: '9.0.1'
  ANDROID_NDK_VERSION: '30.0.16248370'
  RELEASE_TAG: 'v1.2.0-chromeos-alpha4'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils curl patchelf xz-utils autoconf automake libtool pkg-config ffmpeg genisoimage libavformat-dev libavcodec-dev libavutil-dev
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build bundled LGPL FFmpeg runtime
        run: |
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            bash android/native/build-ffmpeg-android.sh

      - name: Test UDF reads and production JNI remux parity
        run: |
          python3 -m pip install pycdlib==1.14.0
          bash android/native/tests/test-udf-source.sh "$PWD/android/native/.work/libudfread"
          bash android/native/tests/test-host-remux.sh "$PWD/android/native/.work/libudfread" "$RUNNER_TEMP/remux-parity"

      - name: Test, lint and build APK
        run: gradle -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify APK version and bundled native libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "${APK}"
          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "${APK}")"
          grep -Fq "versionCode='104'" <<<"${BADGING}"
          grep -Fq "versionName='1.2.0-chromeos-alpha4'" <<<"${BADGING}"
          python3 android/native/verify-package.py "${APK}"
          unzip -p "${APK}" assets/ffmpeg/ffmpeg-build-info.txt | grep -q 'FFmpeg version: 9.0.1'
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "${APK}"

      - name: Refuse to overwrite an existing historical alpha tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already exists. Update RELEASE_TAG/version metadata for a new alpha instead of overwriting history." >&2
            exit 1
          fi

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          cp "${APK}" dist/MattMux-1.2.0-ChromeOS-Alpha4.apk
          cp android/native/.work/ffmpeg-${FFMPEG_VERSION}.tar.xz dist/FFmpeg-${FFMPEG_VERSION}-source.tar.xz
          cp android/native/.work/libudfread-1.1.2-source.tar.gz dist/
          cp android/app/src/main/assets/ffmpeg/LIBUDFREAD_COPYING.txt dist/
          cp android/app/src/main/assets/ffmpeg/ffmpeg-build-info.txt dist/FFmpeg-build-info.txt
          cp android/app/src/main/assets/ffmpeg/COPYING.LGPLv2.1 dist/COPYING.LGPLv2.1.txt
          cp android/app/src/main/assets/ffmpeg/FFMPEG_LICENSE.md dist/FFMPEG_LICENSE.md
          (cd dist && sha256sum MattMux-1.2.0-ChromeOS-Alpha4.apk FFmpeg-${FFMPEG_VERSION}-source.tar.xz libudfread-1.1.2-source.tar.gz LIBUDFREAD_COPYING.txt FFmpeg-build-info.txt COPYING.LGPLv2.1.txt FFMPEG_LICENSE.md > SHA256SUMS.txt)

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --target "$(git rev-parse HEAD)" \
            --title 'MattMux 1.2.0 ChromeOS Alpha 4' \
            --prerelease \
            --notes 'Experimental Android/ChromeOS Alpha 4 build. See android/README.md and THIRD_PARTY.md for current limitations, native runtime provenance, and licensing details.'
