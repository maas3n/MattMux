name: Release Android / ChromeOS alpha

on:
  push:
    branches:
      - android-chromeos
    paths:
      - '.github/ANDROID_ALPHA_RELEASE'
  workflow_dispatch:

permissions:
  contents: write

env:
  FFMPEG_VERSION: '9.0.1'
  ANDROID_NDK_VERSION: '30.0.16248370'
  RELEASE_TAG: 'v1.2.0-chromeos-alpha3'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils curl patchelf xz-utils
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build bundled LGPL FFmpeg runtime
        run: |
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            bash android/native/build-ffmpeg-android.sh

      - name: Test, lint and build APK
        run: |
          gradle -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify APK version and bundled native libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "${APK}"

          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "${APK}")"
          grep -Fq "versionCode='103'" <<<"${BADGING}"
          grep -Fq "versionName='1.2.0-chromeos-alpha3'" <<<"${BADGING}"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          for abi in arm64-v8a x86_64; do
            for lib in libavutil.so libavcodec.so libavformat.so libmattmux_jni.so; do
              unpacked="${tmp}/${abi}-${lib}"
              unzip -p "${APK}" "lib/${abi}/${lib}" > "${unpacked}"

              mapfile -t load_alignments < <(
                readelf -lW "${unpacked}" | awk '$1 == "LOAD" { print $NF }'
              )
              (( ${#load_alignments[@]} > 0 )) || exit 1
              for alignment in "${load_alignments[@]}"; do
                (( alignment >= 0x4000 )) || {
                  echo "ELF LOAD alignment below 16 KB in ${abi}/${lib}: ${alignment}" >&2
                  exit 1
                }
              done

              if readelf -dW "${unpacked}" \
                | grep -Eiq 'NEEDED.*(dvdnav|dvdread|dvdcss|x264|x265|xvid)'; then
                echo "Forbidden dependency in packaged ${abi}/${lib}" >&2
                exit 1
              fi
            done
          done

          unzip -p "${APK}" assets/ffmpeg/ffmpeg-build-info.txt \
            | grep -q 'FFmpeg version: 9.0.1'

          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" \
            -c -P 16 -v 4 "${APK}"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          cp "${APK}" dist/MattMux-1.2.0-ChromeOS-Alpha3.apk
          cp android/native/.work/ffmpeg-${FFMPEG_VERSION}.tar.xz \
            dist/FFmpeg-${FFMPEG_VERSION}-source.tar.xz
          cp android/app/src/main/assets/ffmpeg/ffmpeg-build-info.txt \
            dist/FFmpeg-build-info.txt
          cp android/app/src/main/assets/ffmpeg/COPYING.LGPLv2.1 \
            dist/COPYING.LGPLv2.1.txt
          cp android/app/src/main/assets/ffmpeg/FFMPEG_LICENSE.md \
            dist/FFMPEG_LICENSE.md

          (
            cd dist
            sha256sum \
              MattMux-1.2.0-ChromeOS-Alpha3.apk \
              FFmpeg-${FFMPEG_VERSION}-source.tar.xz \
              FFmpeg-build-info.txt \
              COPYING.LGPLv2.1.txt \
              FFMPEG_LICENSE.md \
              > SHA256SUMS.txt
          )

          cat > dist/RELEASE_NOTES.md <<'EOF'
          # MattMux 1.2.0 ChromeOS Alpha 3

          Early Chromebook/Android test build with ChromeOS window-state and release-integrity hardening.

          Changes since Alpha 2:
          - preserves selected source/output URIs across Activity recreation, including ChromeOS free-form window resizing;
          - stacks source buttons in compact windows and with large font scaling;
          - adds Android unit tests for responsive layout policy;
          - verifies packaged native ELF LOAD alignment is at least 16 KB for both arm64-v8a and x86_64;
          - re-checks the final APK for forbidden GPL/DVD native dependencies;
          - adds a separate signed Google Play AAB workflow that uses repository secrets and verifies the AAB signature.

          This APK remains self-contained and bundles an LGPL-only FFmpeg 9.0.1 runtime for arm64-v8a and x86_64. No FFmpeg download is required after installation.

          Important: the Android/ChromeOS remux engine is still under development and Google Play purchases remain disabled. This APK is for installation/UI/native-runtime testing only and is not the final Play Store build.

          The APK is signed with the standard Android debug key for test installation. The Play workflow is prepared for upload-key signing once the required GitHub Actions secrets are configured.

          Bundled FFmpeg is built without GPL, nonfree, libdvdnav, libdvdread, or libdvdcss components. The exact FFmpeg source archive, LGPL notice, FFmpeg license file, build provenance, and SHA-256 checksums are included as release assets.
          EOF

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=(
            dist/MattMux-1.2.0-ChromeOS-Alpha3.apk
            dist/FFmpeg-${FFMPEG_VERSION}-source.tar.xz
            dist/FFmpeg-build-info.txt
            dist/COPYING.LGPLv2.1.txt
            dist/FFMPEG_LICENSE.md
            dist/SHA256SUMS.txt
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Refusing to replace ${RELEASE_TAG} assets: tag points to $tag_sha but this build is $GITHUB_SHA." >&2
              echo "Bump the alpha version instead of publishing different source under the same tag." >&2
              exit 1
            fi
            gh release upload "${RELEASE_TAG}" "${ASSETS[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${ASSETS[@]}" \
              --target "${GITHUB_SHA}" \
              --title 'MattMux 1.2.0 ChromeOS Alpha 3' \
              --notes-file dist/RELEASE_NOTES.md \
              --prerelease
          fi
