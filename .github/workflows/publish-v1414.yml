name: Publish approved MattMux 1.4.14
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1414.yml']
permissions:
  contents: write
  actions: write
  pull-requests: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: e8460bbb9b20e352071e0eabadc7ef8b13e7c462
      - name: Require merged fix and successful platform checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e8460bbb9b20e352071e0eabadc7ef8b13e7c462
          gh api "repos/$GITHUB_REPOSITORY/pulls/51" \
            | jq -e '.merged == true and .head.sha == "e8460bbb9b20e352071e0eabadc7ef8b13e7c462"'
          for run in 36067830812 36067830828 36067831417; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
              | jq -e '.head_sha == "e8460bbb9b20e352071e0eabadc7ef8b13e7c462" and .status == "completed" and .conclusion == "success"'
          done
      - name: Create immutable v1.4.14 tag
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.4.14 >/dev/null 2>&1; then
            echo 'v1.4.14 already exists; refusing to move it.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.4.14 -m 'MattMux 1.4.14: self-contained Linux GUI libraries and Android startup fix'
          git push origin refs/tags/v1.4.14
      - name: Start complete cross-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v1.4.14 -f tag=v1.4.14
