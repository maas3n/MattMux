name: Release preflight

on:
  push:
    branches:
      - fix/release-audit-2026-09-11

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: '30.0.16248370'

jobs:
  android-release-signing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main release candidate
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils curl patchelf xz-utils autoconf automake libtool pkg-config
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare distribution keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/mattmux-upload.jks"
          test -s "${RUNNER_TEMP}/mattmux-upload.jks"

      - name: Build bundled LGPL FFmpeg runtime
        run: |
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            bash android/native/build-ffmpeg-android.sh

      - name: Build signed v1.4.1 APK
        env:
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_STORE_FILE: ${{ runner.temp }}/mattmux-upload.jks
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          gradle -p android \
            -PMATTMUX_VERSION_NAME='1.4.1' \
            -PMATTMUX_VERSION_CODE='10401999' \
            :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Verify signed release APK
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"
          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK")"
          grep -Fq "versionCode='10401999'" <<<"$BADGING"
          grep -Fq "versionName='1.4.1'" <<<"$BADGING"
          python3 android/native/verify-package.py "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          ! grep -Fq 'CN=Android Debug' /tmp/apksigner.txt
          echo 'Signed Android v1.4.1 preflight succeeded.'
