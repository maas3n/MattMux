name: Release readiness

on:
  push:
    branches:
      - fix/release-audit-2026-09-11

permissions:
  contents: read

jobs:
  signing:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Android distribution signing inputs and private key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          keystore="$RUNNER_TEMP/mattmux-upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list -keystore "$keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          mkdir -p "$RUNNER_TEMP/sign-test"
          printf 'MattMux signing readiness\n' > "$RUNNER_TEMP/sign-test/payload.txt"
          jar --create --file "$RUNNER_TEMP/sign-test.jar" -C "$RUNNER_TEMP/sign-test" payload.txt
          jarsigner -keystore "$keystore" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$RUNNER_TEMP/sign-test.jar" "$KEY_ALIAS" >/dev/null
          jarsigner -verify "$RUNNER_TEMP/sign-test.jar" >/dev/null
          echo 'Android distribution signing secrets and private-key password are valid.'
