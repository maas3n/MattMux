name: Android / ChromeOS Play bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play-bundle:
    runs-on: ubuntu-latest
    env:
      FFMPEG_VERSION: '9.0.1'
      ANDROID_NDK_VERSION: '30.0.16248370'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y curl patchelf xz-utils
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Require Play upload signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!value:-}" || {
              echo "Missing required GitHub Actions secret: ${value}" >&2
              exit 1
            }
          done

      - name: Prepare upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/mattmux-upload.jks"
          test -s "${RUNNER_TEMP}/mattmux-upload.jks"

      - name: Build bundled LGPL FFmpeg runtime
        run: |
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            bash android/native/build-ffmpeg-android.sh

      - name: Test, lint and build signed bundle
        env:
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_STORE_FILE: ${{ runner.temp }}/mattmux-upload.jks
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          gradle -p android :app:testDebugUnitTest :app:lintRelease :app:bundleRelease

      - name: Verify signed AAB
        run: |
          set -euo pipefail
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$AAB"
          jarsigner -verify -strict -certs "$AAB"
          unzip -l "$AAB" 'base/lib/arm64-v8a/libmattmux_jni.so' | grep -q libmattmux_jni.so
          unzip -l "$AAB" 'base/lib/x86_64/libmattmux_jni.so' | grep -q libmattmux_jni.so

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: MattMux-Android-ChromeOS-Play-AAB
          if-no-files-found: error
          path: android/app/build/outputs/bundle/release/*.aab
