name: One-time Android ChromeOS APK consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-android-chromeos-apk.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update Android ChromeOS documentation only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          exact('README.md',
                '| Android phone / tablet | `MattMux-1.4.8-Android.apk` | Signed universal APK; behavior unchanged from 1.4.7 |\n| ChromeOS | `MattMux-1.4.8-ChromeOS.apk` | Byte-identical alias of the Android APK |',
                '| Android / ChromeOS | `MattMux-1.4.8-Android.apk` | One signed universal APK for Android phones/tablets and Chromebooks with Android app support |')
          exact('README.md',
                '- The `Android.apk` and `ChromeOS.apk` release assets are the same signed universal APK under device-friendly names',
                '- The single `Android.apk` release asset is the signed universal APK for Android phones/tablets and Chromebooks with Android app support')
          exact('README.md',
                'For Android phones/tablets, download `MattMux-1.4.8-Android.apk`. For Chromebooks, download `MattMux-1.4.8-ChromeOS.apk` from the [MattMux 1.4.8 release](https://github.com/maas3n/MattMux/releases/tag/v1.4.8). They are the same persistently signed universal APK; 1.4.8 does not change Android/ChromeOS product behavior from 1.4.7.',
                'For Android phones/tablets and Chromebooks with Android app support, download `MattMux-1.4.8-Android.apk` from the [MattMux 1.4.8 release](https://github.com/maas3n/MattMux/releases/tag/v1.4.8). It is the single persistently signed universal APK for both Android and ChromeOS; 1.4.8 does not change Android/ChromeOS product behavior from 1.4.7.')

          exact('RELEASING.md',
                '- `MattMux-<version>-Android.apk`\n- `MattMux-<version>-ChromeOS.apk`',
                '- `MattMux-<version>-Android.apk` — universal APK for Android phones/tablets and Chromebooks with Android app support')
          exact('RELEASING.md',
                'The Android and ChromeOS APK filenames are byte-identical aliases of the same persistently signed universal APK. The separate names make the intended device class obvious without maintaining separate Android builds.',
                '`MattMux-<version>-Android.apk` is the single persistently signed universal APK for both Android phones/tablets and Chromebooks with Android app support.')
          exact('RELEASING.md',
                '5. builds one signed universal Android APK and publishes byte-identical Android/ChromeOS filename aliases;',
                '5. builds one signed universal `MattMux-<version>-Android.apk` for both Android and ChromeOS;')

          exact('android/README.md',
                'This directory contains the experimental Android/ChromeOS frontend for MattMux. Android/ChromeOS follows the unified MattMux release line; the current published unified release is **1.4.2** (`v1.4.2`). MattMux 1.4.1 was the first GitHub APK release using the persistent MattMux distribution-signing key; 1.4.2 publishes that same signed universal APK under explicit Android and ChromeOS filenames.\n\nFor GitHub releases, use `MattMux-<version>-Android.apk` on Android phones/tablets and `MattMux-<version>-ChromeOS.apk` on Chromebooks. The two files are byte-for-byte identical aliases of one universal APK.',
                'This directory contains the experimental Android/ChromeOS frontend for MattMux. Android/ChromeOS follows the unified MattMux release line. GitHub releases publish one persistently signed universal APK named `MattMux-<version>-Android.apk`.\n\nUse `MattMux-<version>-Android.apk` on Android phones/tablets and on Chromebooks with Android app support. The same APK supports both Android and ChromeOS; no separate ChromeOS APK is required.')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md RELEASING.md android/README.md
          git diff --cached --check
          git commit -m 'Document one APK for Android and ChromeOS'
          git push origin HEAD:main

      - name: Clean only Android ChromeOS assets in v1.4.9
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag='v1.4.9'
          chrome='MattMux-1.4.9-ChromeOS.apk'
          android='MattMux-1.4.9-Android.apk'
          work="$RUNNER_TEMP/mattmux-apk-cleanup"
          mkdir -p "$work/before" "$work/after"

          # Guardrail 1: snapshot every Windows/Linux release asset before touching Android/ChromeOS metadata.
          gh api "repos/$repo/releases/tags/$tag" \
            --jq '.assets[] | select(.name|test("Windows|Linux")) | [.id,.name,.size,.digest,.created_at,.updated_at] | @tsv' \
            | sort > "$work/desktop-before.tsv"

          gh release download "$tag" --repo "$repo" \
            --pattern 'SHA256SUMS-Android.txt' --pattern 'SHA256SUMS.txt' --dir "$work/before"
          test -s "$work/before/SHA256SUMS-Android.txt"
          test -s "$work/before/SHA256SUMS.txt"
          grep -E 'Windows|Linux' "$work/before/SHA256SUMS.txt" > "$work/desktop-checksums-before.txt"

          # Remove only the duplicate ChromeOS APK checksum entry.
          for name in SHA256SUMS-Android.txt SHA256SUMS.txt; do
            src="$work/before/$name"
            dst="$work/after/$name"
            grep -F "$chrome" "$src" >/dev/null
            grep -Fv "$chrome" "$src" > "$dst"
            if grep -F "$chrome" "$dst" >/dev/null; then
              echo "Failed to remove only $chrome from $name" >&2
              exit 1
            fi
          done
          grep -E 'Windows|Linux' "$work/after/SHA256SUMS.txt" > "$work/desktop-checksums-after.txt"
          diff -u "$work/desktop-checksums-before.txt" "$work/desktop-checksums-after.txt"

          gh release upload "$tag" --repo "$repo" \
            "$work/after/SHA256SUMS-Android.txt" "$work/after/SHA256SUMS.txt" --clobber

          # Keep existing notes and append one explicit Android/ChromeOS download instruction.
          gh api "repos/$repo/releases/tags/$tag" > "$work/release.json"
          python3 - "$work/release.json" "$work/notes.md" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          body = (data.get('body') or '').rstrip()
          note = ('### Android / ChromeOS\n\n'
                  'Download `MattMux-1.4.9-Android.apk` for Android phones/tablets and Chromebooks with Android app support. '
                  'It is the single universal APK for both Android and ChromeOS; no separate ChromeOS APK is required.')
          if note not in body:
              body += '\n\n' + note
          open(sys.argv[2], 'w', encoding='utf-8').write(body + '\n')
          PY
          gh release edit "$tag" --repo "$repo" --notes-file "$work/notes.md"

          # Delete only the byte-identical ChromeOS alias.
          asset_id="$(gh api "repos/$repo/releases/tags/$tag" --jq ".assets[] | select(.name == \"$chrome\") | .id")"
          test -n "$asset_id"
          gh api --method DELETE "repos/$repo/releases/assets/$asset_id"

          # Verify the intended APK state.
          gh api "repos/$repo/releases/tags/$tag" --jq '.assets[].name' | grep -Fx "$android"
          if gh api "repos/$repo/releases/tags/$tag" --jq '.assets[].name' | grep -Fx "$chrome"; then
            echo "$chrome still exists" >&2
            exit 1
          fi

          # Guardrail 2: Windows/Linux release asset IDs, names, sizes, hashes and timestamps must remain byte-for-byte metadata-identical.
          gh api "repos/$repo/releases/tags/$tag" \
            --jq '.assets[] | select(.name|test("Windows|Linux")) | [.id,.name,.size,.digest,.created_at,.updated_at] | @tsv' \
            | sort > "$work/desktop-after.tsv"
          diff -u "$work/desktop-before.tsv" "$work/desktop-after.tsv"
