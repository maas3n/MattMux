name: Harden Advanced Merger release gates

on:
  push:
    branches:
      - feature/advanced-merger

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/advanced-merger
          fetch-depth: 0

      - name: Require merger tests in unified release
        env:
          WIN_MARKER_B64: ICAgICAgICAgICYgKEpvaW4tUGF0aCAkZmZEZXN0ICdmZm1wZWcuZXhlJykgLWhpZGVfYmFubmVyIC1kZW11eGVycyB8IFNlbGVjdC1TdHJpbmcgZHZkdmlkZW8KICAgICAgICAgIGlmICgkTEFTVEVYSVRDT0RFIC1uZSAwKSB7IHRocm93ICdCdW5kbGVkIEZGbXBlZyBzZWxmLWNoZWNrIGZhaWxlZCcgfQoKICAgICAgLSBuYW1lOiBCdWlsZCBXaW5kb3dzIHBvcnRhYmxlIHBhY2thZ2UK
          WIN_REPL_B64: 
          LIN_MARKER_B64: ICAgICAgICAgIHN1ZG8gYXB0LWdldCBpbnN0YWxsIC15IFwKICAgICAgICAgICAgZ2NjIGcrKyBjbWFrZSBuaW5qYS1idWlsZCBjdXJsIHh6LXV0aWxzIGZpbGUgXAogICAgICAgICAgICBsaWJnbDEtbWVzYS1kZXYgeG9yZy1kZXYgbGlid2F5bGFuZC1kZXYgbGlieGtiY29tbW9uLWRldgoKICAgICAgLSBuYW1lOiBWZXJpZnkgR28gbW9kdWxlIG1ldGFkYXRhCg==
          LIN_REPL_B64: 
          LIN2_MARKER_B64: ICAgICAgICAgIFhER19DQUNIRV9IT01FPSIkY2FjaGUiICIkc3RhbmRhbG9uZSIgLS1zdGFuZGFsb25lLXNlbGYtdGVzdAogICAgICAgICAgcm0gLXJmICIkY2FjaGUiCgogICAgICAtIG5hbWU6IENyZWF0ZSBMaW51eCBjaGVja3N1bXMK
          LIN2_REPL_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('.github/workflows/release.yml')
          s = p.read_text()
          for left, right, label in [
              ('WIN_MARKER_B64', 'WIN_REPL_B64', 'Windows packaged merger gate'),
              ('LIN_MARKER_B64', 'LIN_REPL_B64', 'Linux real-media merger gate'),
              ('LIN2_MARKER_B64', 'LIN2_REPL_B64', 'Linux packaged merger gate'),
          ]:
              marker = base64.b64decode(os.environ[left]).decode()
              repl = base64.b64decode(os.environ[right]).decode()
              if marker not in s:
                  raise SystemExit(label + ' insertion point not found')
              s = s.replace(marker, repl, 1)
          p.write_text(s)
          PY

      - name: Check workflow diff
        run: |
          git diff --check
          grep -F 'Exercise Advanced Merger with packaged Windows FFmpeg' .github/workflows/release.yml
          grep -F 'Test Advanced Merger with real media and headless UI' .github/workflows/release.yml
          grep -F 'Exercise packaged Linux FFmpeg and launch packaged GUI' .github/workflows/release.yml

      - name: Commit hardening and remove helper
        run: |
          rm .github/workflows/harden-advanced-merger-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require Advanced Merger tests in release builds"
          git push origin HEAD:feature/advanced-merger
