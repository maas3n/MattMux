name: Apply dvdvideo title-discovery refactor

on:
  push:
    branches:
      - refactor/dvdvideo-title-discovery
    paths:
      - .github/workflows/apply-dvdvideo-title-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dvdvideo-title-discovery
          fetch-depth: 0
      - name: Remove legacy MattMux title-scan identifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src')
          replacements = (
              ('probeDurationOnce', 'readDVDVideoTitleDurationAttempt'),
              ('probeDuration', 'readDVDVideoTitleDuration'),
              ('scanTitles', 'discoverDVDTitlesViaDVDVideo'),
              ('discoverWindowsDVDTitlesViaDVDVideo', 'discoverDVDTitlesViaDVDVideo'),
          )
          changed = []
          for path in root.rglob('*.go'):
              text = path.read_text(encoding='utf-8')
              new = text
              for old, repl in replacements:
                  new = new.replace(old, repl)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          leftovers = []
          for path in root.rglob('*.go'):
              text = path.read_text(encoding='utf-8')
              if 'probeDuration' in text or 'scanTitles' in text:
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('legacy title scan identifiers remain: ' + ', '.join(leftovers))

          print('updated:')
          for path in changed:
              print('  ' + path)
          PY
          gofmt -w $(git diff --name-only -- 'src/*.go' 'src/**/*.go' | tr '\n' ' ')
          git rm .github/workflows/apply-dvdvideo-title-refactor.yml
      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove legacy MattMux title-scan wrappers'
          git push origin HEAD:refactor/dvdvideo-title-discovery
