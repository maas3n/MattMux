name: Clean v1.4.2 mutation workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Clean v1.4.2 mutation workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove one-shot mutation workflows and commit clean source
        id: clean
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mutate-v1.4.2-linux.yml .github/workflows/cleanup-v1.4.2-mutation.yml
          git commit -m 'Remove one-shot v1.4.2 mutation workflows'
          clean_sha="$(git rev-parse HEAD)"
          echo "clean_sha=$clean_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Force-move v1.4.2 to clean source
        run: |
          set -euo pipefail
          clean_sha='${{ steps.clean.outputs.clean_sha }}'
          git tag -fa v1.4.2 "$clean_sha" -m 'MattMux 1.4.2'
          git push --force origin refs/tags/v1.4.2

      - name: Rebuild clean source tarball and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          clean_sha='${{ steps.clean.outputs.clean_sha }}'
          rm -rf release-assets source-work
          mkdir -p release-assets source-work/MattMux-1.4.2-Source
          gh release download v1.4.2 --repo "$GITHUB_REPOSITORY" --dir release-assets
          git archive "$clean_sha" | tar -x -C source-work/MattMux-1.4.2-Source
          tar -C source-work -czf release-assets/MattMux-1.4.2-Source.tar.gz MattMux-1.4.2-Source
          (
            cd release-assets
            sha256sum \
              MattMux-1.4.2-Linux-amd64.deb \
              MattMux-1.4.2-Linux-amd64.tar.gz \
              MattMux-1.4.2-Linux-amd64Standalone \
              MattMux-1.4.2-Source.tar.gz > SHA256SUMS-Linux.txt
            rm -f SHA256SUMS.txt
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Clobber clean source and checksum assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v1.4.2 \
            release-assets/MattMux-1.4.2-Source.tar.gz \
            release-assets/SHA256SUMS-Linux.txt \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify clean tag
        run: |
          set -euo pipefail
          clean_sha='${{ steps.clean.outputs.clean_sha }}'
          git fetch --force origin refs/tags/v1.4.2:refs/tags/v1.4.2
          test "$(git rev-parse v1.4.2^{commit})" = "$clean_sha"
