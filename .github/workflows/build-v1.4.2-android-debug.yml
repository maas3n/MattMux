name: Build v1.4.2 Android DEBUG libdvdnav APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v1.4.2-android-debug.yml'

permissions:
  contents: write

jobs:
  build-debug:
    if: github.event.head_commit.message == 'build v1.4.2 android dvdnav debug apk'
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: '30.0.16248370'
      IGNORE_MISSING_HOST_FFMPEG: '1'
    steps:
      - name: Check out build helper
        uses: actions/checkout@v4
        with:
          ref: main
          path: builder
          fetch-depth: 1

      - name: Check out original v1.4.2 source
        uses: actions/checkout@v4
        with:
          ref: 1a2d74b71bbe3982490abe843ce9a62745c4534e
          path: source
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android and native build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake binutils build-essential curl gettext git libtool \
            make nasm ninja-build patchelf pkg-config unzip xz-utils
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Require Android distribution signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/mattmux-upload.jks"
          test -s "${RUNNER_TEMP}/mattmux-upload.jks"

      - name: Reconstruct and validate DEBUG build helper
        shell: bash
        run: |
          set -euo pipefail
          cat builder/.github/debug-build-parts/android-v142-debug-part*.b64 \
            | tr -d '\r\n' \
            | base64 --decode > source/.build-v142-android-debug.sh
          chmod +x source/.build-v142-android-debug.sh
          bash -n source/.build-v142-android-debug.sh
          grep -Fq 'dvdnav_get_number_of_titles' source/.build-v142-android-debug.sh
          grep -Fq 'dvdnav_describe_title_chapters(nav, title - 1' source/.build-v142-android-debug.sh

      - name: Host FFmpeg PATH check (non-fatal for Android DEBUG)
        shell: bash
        run: |
          set -u
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "Host ffmpeg is available at: $(command -v ffmpeg)"
          else
            echo '::warning::FFmpeg not found in PATH; intentionally ignoring it for this Android native DEBUG build.'
          fi

      - name: Build and verify signed DEBUG APK
        shell: bash
        working-directory: source
        env:
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_STORE_FILE: ${{ runner.temp }}/mattmux-upload.jks
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          # The DEBUG helper recompiles mattmux_jni.c after the normal Android
          # native build. Reuse libudfread's installed headers for that extra
          # compile so <udfread.h> resolves without requiring a host package.
          CPATH: ${{ github.workspace }}/source/android/native/.work/install-arm64-v8a/include:${{ github.workspace }}/source/android/native/.work/install-arm64-v8a/include/udfread
        run: |
          set -uo pipefail
          build_log="${RUNNER_TEMP}/mattmux-v142-android-debug-build.log"
          set +e
          ./.build-v142-android-debug.sh 2>&1 | tee "$build_log"
          build_status=${PIPESTATUS[0]}
          set -e

          if (( build_status != 0 )); then
            if [[ "${IGNORE_MISSING_HOST_FFMPEG:-0}" == '1' ]] && \
               grep -Eqi '(ffmpeg[^[:cntrl:]]*not found[^[:cntrl:]]*PATH|FFmpeg not found in PATH|not found in PATH[^[:cntrl:]]*ffmpeg)' "$build_log"; then
              echo "::warning::Ignoring DEBUG helper exit ${build_status} because its failure matches the configured missing-host-FFmpeg PATH exception."
            else
              echo "::error::DEBUG build helper failed with exit code ${build_status}."
              exit "$build_status"
            fi
          fi

          # A false host-FFmpeg PATH error is only ignorable when the actual
          # Android output was still produced. Never publish a missing/broken APK.
          test -s dist/MattMux-1.4.2-Android-DEBUG.apk
          test -s dist/MattMux-1.4.2-Android-DEBUG.apk.sha256

      - name: Upload DEBUG build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MattMux-1.4.2-Android-DEBUG-build-log
          if-no-files-found: warn
          path: ${{ runner.temp }}/mattmux-v142-android-debug-build.log

      - name: Upload DEBUG APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MattMux-1.4.2-Android-DEBUG
          if-no-files-found: error
          path: |
            source/dist/MattMux-1.4.2-Android-DEBUG.apk
            source/dist/MattMux-1.4.2-Android-DEBUG.apk.sha256

      - name: Attach DEBUG APK and GPL source archives to v1.4.2 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v1.4.2 \
            source/dist/MattMux-1.4.2-Android-DEBUG.apk \
            source/dist/MattMux-1.4.2-Android-DEBUG.apk.sha256 \
            source/dist/libdvdread-6.1.3-source.tar.gz \
            source/dist/libdvdnav-6.1.1-source.tar.gz \
            --clobber --repo maas3n/MattMux
