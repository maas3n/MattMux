name: Build v1.4.2 Android DEBUG libdvdnav APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v1.4.2-android-debug.yml'

permissions:
  contents: write

jobs:
  build-debug:
    if: github.event.head_commit.message == 'build v1.4.2 android dvdnav debug apk'
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: '30.0.16248370'
      IGNORE_MISSING_HOST_FFMPEG: '1'
      BETA_TAG: 'v1.4.2-dvdnav-beta.1'
      BETA_APK: 'MattMux-1.4.2-Android-DVDNav-Beta1.apk'
    steps:
      - name: Check out build helper
        uses: actions/checkout@v4
        with:
          ref: main
          path: builder
          fetch-depth: 1

      - name: Check out original v1.4.2 source
        uses: actions/checkout@v4
        with:
          ref: 1a2d74b71bbe3982490abe843ce9a62745c4534e
          path: source
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android and native build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake binutils build-essential curl gettext git libtool \
            make nasm ninja-build patchelf pkg-config unzip xz-utils
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Require Android distribution signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/mattmux-upload.jks"
          test -s "${RUNNER_TEMP}/mattmux-upload.jks"

      - name: Reconstruct, patch, and validate BETA build helper
        shell: bash
        run: |
          set -euo pipefail
          cat builder/.github/debug-build-parts/android-v142-debug-part*.b64 \
            | tr -d '\r\n' \
            | base64 --decode > source/.build-v142-android-debug.sh

          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/.build-v142-android-debug.sh')
          s = p.read_text()
          old = '    rm -rf "$read_build" "$nav_build" "$prefix"\n'
          new = '    rm -rf "$read_build" "$nav_build"\n'
          if old not in s:
              raise SystemExit('expected destructive DVD prefix cleanup line was not found')
          s = s.replace(old, new, 1)
          s = s.replace('1.4.2-DEBUG', '1.4.2-DVDNAV-BETA1')
          s = s.replace('MattMux-1.4.2-Android-DEBUG', 'MattMux-1.4.2-Android-DVDNav-Beta1')
          p.write_text(s)
          PY

          chmod +x source/.build-v142-android-debug.sh
          bash -n source/.build-v142-android-debug.sh
          grep -Fq 'dvdnav_get_number_of_titles' source/.build-v142-android-debug.sh
          grep -Fq 'dvdnav_describe_title_chapters(nav, title - 1' source/.build-v142-android-debug.sh
          grep -Fq 'rm -rf "$read_build" "$nav_build"' source/.build-v142-android-debug.sh
          if grep -Fq 'rm -rf "$read_build" "$nav_build" "$prefix"' source/.build-v142-android-debug.sh; then
            echo '::error::DEBUG helper still deletes the normal FFmpeg/libudfread install prefix.'
            exit 1
          fi
          grep -Fq '1.4.2-DVDNAV-BETA1' source/.build-v142-android-debug.sh

      - name: Upload reconstructed BETA helper
        uses: actions/upload-artifact@v4
        with:
          name: MattMux-1.4.2-Android-DVDNav-Beta1-helper
          include-hidden-files: true
          if-no-files-found: error
          path: source/.build-v142-android-debug.sh

      - name: Host FFmpeg PATH check (non-fatal for Android BETA)
        shell: bash
        run: |
          set -u
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "Host ffmpeg is available at: $(command -v ffmpeg)"
          else
            echo '::warning::FFmpeg not found in PATH; intentionally ignoring it for this Android native BETA build.'
          fi

      - name: Build and verify signed BETA APK
        shell: bash
        working-directory: source
        env:
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_STORE_FILE: ${{ runner.temp }}/mattmux-upload.jks
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          build_log="${RUNNER_TEMP}/mattmux-v142-android-dvdnav-beta1-build.log"
          set +e
          ./.build-v142-android-debug.sh 2>&1 | tee "$build_log"
          build_status=${PIPESTATUS[0]}
          set -e

          if (( build_status != 0 )); then
            if [[ "${IGNORE_MISSING_HOST_FFMPEG:-0}" == '1' ]] && \
               grep -Eqi '(ffmpeg[^[:cntrl:]]*not found[^[:cntrl:]]*PATH|FFmpeg not found in PATH|not found in PATH[^[:cntrl:]]*ffmpeg)' "$build_log"; then
              echo "::warning::Ignoring helper exit ${build_status} because its failure matches the configured missing-host-FFmpeg PATH exception."
            else
              echo "::error::BETA build helper failed with exit code ${build_status}."
              exit "$build_status"
            fi
          fi

          test -s "dist/${BETA_APK}"
          test -s "dist/${BETA_APK}.sha256"

      - name: Stage corresponding native sources and licenses
        shell: bash
        run: |
          set -euo pipefail
          cp source/android/native/.work/ffmpeg-9.0.1.tar.xz source/dist/FFmpeg-9.0.1-source.tar.xz
          cp source/android/native/.work/libudfread-1.1.2-source.tar.gz source/dist/libudfread-1.1.2-source.tar.gz
          cp source/android/app/src/main/assets/ffmpeg/COPYING.LGPLv2.1 source/dist/COPYING.LGPLv2.1.txt
          cp source/android/app/src/main/assets/ffmpeg/FFMPEG_LICENSE.md source/dist/FFMPEG_LICENSE.md
          cp source/android/app/src/main/assets/ffmpeg/LIBUDFREAD_COPYING.txt source/dist/LIBUDFREAD_COPYING.txt
          cp source/android/app/src/main/assets/ffmpeg/ffmpeg-build-info.txt source/dist/FFmpeg-build-info.txt
          test -s source/dist/libdvdread-6.1.3-source.tar.gz
          test -s source/dist/libdvdnav-6.1.1-source.tar.gz

      - name: Upload BETA build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MattMux-1.4.2-Android-DVDNav-Beta1-build-log
          if-no-files-found: warn
          path: ${{ runner.temp }}/mattmux-v142-android-dvdnav-beta1-build.log

      - name: Upload BETA APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MattMux-1.4.2-Android-DVDNav-Beta1
          if-no-files-found: error
          path: |
            source/dist/MattMux-1.4.2-Android-DVDNav-Beta1.apk
            source/dist/MattMux-1.4.2-Android-DVDNav-Beta1.apk.sha256

      - name: Publish Android DVDNav Beta 1 prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(
            "source/dist/${BETA_APK}"
            "source/dist/${BETA_APK}.sha256"
            source/dist/FFmpeg-9.0.1-source.tar.xz
            source/dist/FFmpeg-build-info.txt
            source/dist/FFMPEG_LICENSE.md
            source/dist/COPYING.LGPLv2.1.txt
            source/dist/libudfread-1.1.2-source.tar.gz
            source/dist/LIBUDFREAD_COPYING.txt
            source/dist/libdvdread-6.1.3-source.tar.gz
            source/dist/libdvdnav-6.1.1-source.tar.gz
          )

          notes=$(cat <<'EOF'
          Experimental Android/ChromeOS beta for DVD title scanning with libdvdnav 6.1.1 and libdvdread 6.1.3.

          This beta is based on the MattMux 1.4.2 Android code path and is intended specifically to test libdvdnav/libdvdread title discovery before any stable integration.

          Changes in this beta:
          - Uses libdvdnav + libdvdread for DVD title discovery in the experimental Android path.
          - Keeps the normal bundled FFmpeg + libudfread runtime intact and adds the DVD libraries without deleting its install prefix.
          - A missing host ffmpeg executable on the GitHub runner is non-fatal; the Android native libraries are built directly.
          - Signed with the normal Android distribution signing key.

          This remains limited to unencrypted user-accessible DVD data. No CSS decryption/circumvention is included.
          EOF
          )

          if gh release view "$BETA_TAG" --repo maas3n/MattMux >/dev/null 2>&1; then
            gh release upload "$BETA_TAG" "${files[@]}" --clobber --repo maas3n/MattMux
          else
            gh release create "$BETA_TAG" "${files[@]}" \
              --target "${GITHUB_SHA}" \
              --title 'MattMux 1.4.2 Android DVDNav Beta 1' \
              --notes "$notes" \
              --prerelease \
              --repo maas3n/MattMux
          fi
