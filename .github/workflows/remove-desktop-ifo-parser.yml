name: Remove desktop MattMux IFO parser

on: [push]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
      - name: Apply migration
        run: |
          python3 tmp/remove_desktop_ifo_parser.py
          gofmt -w src/dvdchapter_types.go src/no_mattmux_ifo_parser_test.go src/app_windows_4.go src/linux_core.go
          git diff --check
          ! grep -R --line-number --include='*.go' -E 'ReadDVDChapters\(|func readIFO\(|func mapGlobalTitle\(|func parseVTSPTTTable\(|func parsePGC\(|ErrNativeDVDChaptersUnsupported|native DVD IFO parser' src
      - name: Test desktop source
        run: |
          cd src
          go test -tags cli ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test ./...
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src README.md
          git diff --cached --quiet && exit 1
          git commit -m 'Remove MattMux-written desktop IFO parser'
          git push origin HEAD:main
