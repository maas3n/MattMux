name: Android / ChromeOS

on:
  push:
    branches:
      - main
      - android-chromeos
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FFMPEG_VERSION: '9.0.1'
  ANDROID_NDK_VERSION: '30.0.16248370'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y curl patchelf xz-utils
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build bundled LGPL FFmpeg runtime
        run: |
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            bash android/native/build-ffmpeg-android.sh

      - name: Lint and build
        run: |
          gradle -p android :app:lintDebug :app:assembleDebug :app:bundleRelease

      - name: Verify bundled native libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "${APK}"

          for abi in arm64-v8a x86_64; do
            for lib in libavutil.so libavcodec.so libavformat.so libmattmux_jni.so; do
              unzip -l "${APK}" "lib/${abi}/${lib}" | grep -q "${lib}"
            done
          done

          unzip -p "${APK}" assets/ffmpeg/ffmpeg-build-info.txt \
            | grep -q 'FFmpeg version: 9.0.1'

          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" \
            -c -P 16 -v 4 "${APK}"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MattMux-Android-ChromeOS
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/src/main/assets/ffmpeg/ffmpeg-build-info.txt
