name: Publish v1.4.1

on:
  push:
    branches:
      - fix/release-audit-2026-09-11

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 626dfcdad79843890bf0968156f7761d99301446
      TAG: v1.4.1
    steps:
      - name: Create immutable release tag
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; refusing to move it." >&2
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${TARGET_SHA}"
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
          test "$actual" = "$TARGET_SHA"

      - name: Dispatch unified release workflow
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$TAG"
          echo "Dispatched unified release workflow for $TAG"
