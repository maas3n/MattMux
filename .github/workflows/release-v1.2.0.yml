name: Release v1.2.0 hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build Windows GUI
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -buildvcs=false -ldflags "-s -w -H=windowsgui" -o ..\MattMux.exe .
          Copy-Item .\MattMux.exe.manifest ..\MattMux.exe.manifest -Force
          Get-FileHash ..\MattMux.exe -Algorithm SHA256

      - name: Stop before publishing
        shell: pwsh
        run: |
          Write-Host 'Build completed from main. Release asset replacement is intentionally performed only after the merged main build is verified.'
