name: Port DVDNav scanner to current Android

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/port-dvdnav-to-current-android.yml'

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: '30.0.16248370'

jobs:
  port-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Port exact DVDNav Beta title-selection strategy
        shell: bash
        run: |
          set -euo pipefail

          cat > android/app/src/main/java/io/github/maas3n/mattmux/DvdNavScanner.kt <<'KOTLIN'
          package io.github.maas3n.mattmux

          import android.content.Context
          import android.net.Uri
          import android.provider.DocumentsContract
          import android.provider.DocumentsContract.Document
          import java.io.File
          import java.util.Locale

          /** Stages only DVD IFO metadata so libdvdnav/libdvdread can select the longest title. */
          internal object DvdNavScanner {
              private data class Entry(val name: String, val documentId: String, val mimeType: String)

              fun stageTreeIfos(context: Context, treeUri: Uri): File {
                  val resolver = context.contentResolver
                  val rootId = DocumentsContract.getTreeDocumentId(treeUri)
                  val rootChildren = listChildren(context, treeUri, rootId)
                  val videoTsId = if (rootChildren.any { it.name.equals("VIDEO_TS.IFO", true) }) {
                      rootId
                  } else {
                      rootChildren.firstOrNull {
                          it.name.equals("VIDEO_TS", true) && it.mimeType == Document.MIME_TYPE_DIR
                      }?.documentId ?: error("VIDEO_TS folder was not found in the selected tree")
                  }

                  val stageRoot = createStageRoot(context)
                  val videoTs = File(stageRoot, "VIDEO_TS").apply { mkdirs() }
                  var copied = 0
                  for (entry in listChildren(context, treeUri, videoTsId)) {
                      val upper = entry.name.uppercase(Locale.ROOT)
                      val keep = upper == "VIDEO_TS.IFO" || upper == "VIDEO_TS.BUP" ||
                          Regex("VTS_[0-9]{2}_0\\.(IFO|BUP)").matches(upper)
                      if (!keep) continue
                      val uri = DocumentsContract.buildDocumentUriUsingTree(treeUri, entry.documentId)
                      resolver.openInputStream(uri)?.use { input ->
                          File(videoTs, upper).outputStream().use { output -> input.copyTo(output) }
                      } ?: error("Could not read ${entry.name}")
                      copied++
                  }
                  require(File(videoTs, "VIDEO_TS.IFO").isFile) { "VIDEO_TS.IFO is missing" }
                  require(copied > 0) { "No DVD IFO metadata could be staged" }
                  return stageRoot
              }

              fun stageIsoIfos(context: Context, vmg: ByteArray, loader: (Int) -> ByteArray?): File {
                  val stageRoot = createStageRoot(context)
                  val videoTs = File(stageRoot, "VIDEO_TS").apply { mkdirs() }
                  File(videoTs, "VIDEO_TS.IFO").writeBytes(vmg)
                  for (titleSet in 1..99) {
                      val data = loader(titleSet) ?: continue
                      File(videoTs, "VTS_%02d_0.IFO".format(Locale.ROOT, titleSet)).writeBytes(data)
                  }
                  return stageRoot
              }

              private fun createStageRoot(context: Context): File {
                  val root = File(context.cacheDir, "mattmux-dvdnav-${System.nanoTime()}")
                  require(root.mkdirs()) { "Could not create libdvdnav staging directory" }
                  return root
              }

              private fun listChildren(context: Context, treeUri: Uri, parentId: String): List<Entry> {
                  val childrenUri = DocumentsContract.buildChildDocumentsUriUsingTree(treeUri, parentId)
                  return context.contentResolver.query(
                      childrenUri,
                      arrayOf(Document.COLUMN_DISPLAY_NAME, Document.COLUMN_DOCUMENT_ID, Document.COLUMN_MIME_TYPE),
                      null, null, null,
                  )?.use { cursor ->
                      val nameCol = cursor.getColumnIndexOrThrow(Document.COLUMN_DISPLAY_NAME)
                      val idCol = cursor.getColumnIndexOrThrow(Document.COLUMN_DOCUMENT_ID)
                      val mimeCol = cursor.getColumnIndexOrThrow(Document.COLUMN_MIME_TYPE)
                      buildList {
                          while (cursor.moveToNext()) {
                              add(Entry(cursor.getString(nameCol), cursor.getString(idCol), cursor.getString(mimeCol)))
                          }
                      }
                  } ?: error("Selected document provider did not return directory contents")
              }
          }
          KOTLIN

          cat > android/native/build-dvdnav-android.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          REPO_ROOT="$(cd "${SCRIPT_DIR}/../.." && pwd)"
          WORK="${SCRIPT_DIR}/.work"
          JNI_ROOT="${REPO_ROOT}/android/app/src/main/jniLibs"
          ASSET_ROOT="${REPO_ROOT}/android/app/src/main/assets/ffmpeg"
          ANDROID_API="${ANDROID_API:-26}"
          : "${ANDROID_NDK_HOME:?Set ANDROID_NDK_HOME to the Android NDK directory.}"

          DVDREAD_VERSION=6.1.3
          DVDNAV_VERSION=6.1.1
          READ_SRC="$WORK/libdvdread"
          NAV_SRC="$WORK/libdvdnav"
          rm -rf "$READ_SRC" "$NAV_SRC"
          git clone --depth 1 --branch "$DVDREAD_VERSION" https://code.videolan.org/videolan/libdvdread.git "$READ_SRC"
          git clone --depth 1 --branch "$DVDNAV_VERSION" https://code.videolan.org/videolan/libdvdnav.git "$NAV_SRC"
          READ_COMMIT="$(git -C "$READ_SRC" rev-parse HEAD)"
          NAV_COMMIT="$(git -C "$NAV_SRC" rev-parse HEAD)"
          git -C "$READ_SRC" archive --format=tar --prefix="libdvdread-${DVDREAD_VERSION}/" HEAD | gzip -n > "$WORK/libdvdread-${DVDREAD_VERSION}-source.tar.gz"
          git -C "$NAV_SRC" archive --format=tar --prefix="libdvdnav-${DVDNAV_VERSION}/" HEAD | gzip -n > "$WORK/libdvdnav-${DVDNAV_VERSION}-source.tar.gz"
          cp "$READ_SRC/COPYING" "$ASSET_ROOT/DVDREAD_COPYING.txt"
          cp "$NAV_SRC/COPYING" "$ASSET_ROOT/DVDNAV_COPYING.txt"
          (cd "$READ_SRC" && autoreconf -fi)
          (cd "$NAV_SRC" && autoreconf -fi)

          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) HOST_TAG=linux-x86_64 ;;
            Darwin-x86_64|Darwin-arm64) HOST_TAG=darwin-x86_64 ;;
            *) echo "Unsupported build host" >&2; exit 1 ;;
          esac
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/$HOST_TAG"
          AR="$TOOLCHAIN/bin/llvm-ar"
          RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          STRIP="$TOOLCHAIN/bin/llvm-strip"
          NM="$TOOLCHAIN/bin/llvm-nm"

          build_one() {
              local abi="$1" target="$2"
              local cc="$TOOLCHAIN/bin/${target}${ANDROID_API}-clang"
              local prefix="$WORK/install-${abi}"
              local jni="$JNI_ROOT/${abi}"
              local read_build="$WORK/build-dvdread-${abi}"
              local nav_build="$WORK/build-dvdnav-${abi}"
              rm -rf "$read_build" "$nav_build"
              mkdir -p "$read_build" "$nav_build"

              test -d "$prefix/include" && test -d "$jni"

              (
                  cd "$read_build"
                  CC="$cc" AR="$AR" RANLIB="$RANLIB" STRIP="$STRIP" \
                    CFLAGS='-O2 -fPIC' LDFLAGS='-Wl,-z,max-page-size=16384' \
                    "$READ_SRC/configure" --host="$target" --prefix="$prefix" --enable-static --disable-shared
                  make -j2
                  make install
              )

              (
                  cd "$nav_build"
                  CC="$cc" AR="$AR" RANLIB="$RANLIB" STRIP="$STRIP" \
                    DVDREAD_CFLAGS="-I$prefix/include" DVDREAD_LIBS="-L$prefix/lib -ldvdread" \
                    CFLAGS='-O2 -fPIC' LDFLAGS='-Wl,-z,max-page-size=16384' \
                    "$NAV_SRC/configure" --host="$target" --prefix="$prefix" --enable-static --disable-shared
                  make -j2
                  make install
              )

              "$cc" \
                  -shared -fPIC -O2 -DMATTMUX_DVDNAV=1 \
                  -I"$prefix/include" -I"$prefix/include/udfread" \
                  "$SCRIPT_DIR/mattmux_jni.c" "$SCRIPT_DIR/udf_source.c" \
                  -L"$jni" -L"$prefix/lib" -Wl,--no-as-needed \
                  -lavformat -lavcodec -lavutil -ludfread \
                  -ldvdnav -ldvdread -ldl -lm \
                  -Wl,-z,max-page-size=16384 -llog -Wl,--no-undefined \
                  -Wl,-soname,libmattmux_jni.so -o "$jni/libmattmux_jni.so"

              while read -r dep; do
                  case "$dep" in
                      libavutil.so.*) patchelf --replace-needed "$dep" libavutil.so "$jni/libmattmux_jni.so" ;;
                      libavcodec.so.*) patchelf --replace-needed "$dep" libavcodec.so "$jni/libmattmux_jni.so" ;;
                      libavformat.so.*) patchelf --replace-needed "$dep" libavformat.so "$jni/libmattmux_jni.so" ;;
                  esac
              done < <(patchelf --print-needed "$jni/libmattmux_jni.so")

              "$NM" "$jni/libmattmux_jni.so" | grep -q 'dvdnav_get_number_of_titles'
              "$NM" "$jni/libmattmux_jni.so" | grep -q 'dvdnav_describe_title_chapters'
              "$NM" "$jni/libmattmux_jni.so" | grep -q 'DVDOpen'
              patchelf --print-needed "$jni/libmattmux_jni.so" | grep -Eiq 'dvdcss' && {
                  echo 'libdvdcss must not be bundled' >&2; exit 1;
              } || true
              "$STRIP" --strip-unneeded "$jni/libmattmux_jni.so"
          }

          build_one arm64-v8a aarch64-linux-android
          build_one x86_64 x86_64-linux-android

          cat >> "$ASSET_ROOT/ffmpeg-build-info.txt" <<EOF

          DVD TITLE DISCOVERY
          Title discovery: libdvdnav ${DVDNAV_VERSION} + libdvdread ${DVDREAD_VERSION}
          Integration: GPL DVD libraries statically linked into libmattmux_jni.so for title discovery
          libdvdread commit: ${READ_COMMIT}
          libdvdnav commit: ${NAV_COMMIT}
          CSS decryption/circumvention: not included
          EOF
          echo "libdvdnav/libdvdread Android title scanner built successfully."
          BASH
          chmod +x android/native/build-dvdnav-android.sh

          python3 - <<'PY'
          from pathlib import Path

          def exact(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(s.replace(old, new, count))

          # DvdIfoParser: allow DVDNav's selected global title to be converted into the existing safe remux plan.
          p = Path('android/app/src/main/java/io/github/maas3n/mattmux/DvdIfoParser.kt')
          s = p.read_text()
          marker = '    private fun parseLocations(vmg: ByteArray): List<Location> {'
          insert = '''    fun selectTitle(vmg: ByteArray, globalTitle: Int, vtsLoader: (Int) -> ByteArray?): DvdTitlePlan {\n        requireMagic(vmg, "DVDVIDEO-VMG")\n        val location = parseLocations(vmg).firstOrNull { it.global == globalTitle }\n            ?: throw IllegalArgumentException("DVD title $globalTitle is outside the VMG title table")\n        val vts = vtsLoader(location.vts)\n            ?: error("VTS_%02d_0.IFO is missing".format(location.vts))\n        return buildPlan(location, vts)\n    }\n\n'''
          if marker not in s or 'fun selectTitle(vmg:' in s:
              raise SystemExit('Unexpected DvdIfoParser state')
          p.write_text(s.replace(marker, insert + marker, 1))

          # Folder source: open the title chosen by DVDNav instead of re-running MattMux longest-title selection.
          p = Path('android/app/src/main/java/io/github/maas3n/mattmux/DvdDocumentSource.kt')
          s = p.read_text()
          old = '    fun openLongestTitle(): OpenTitle {\n'
          new = '    fun openLongestTitle(): OpenTitle = openTitle(null)\n\n    fun openTitle(globalTitle: Int?): OpenTitle {\n'
          if old not in s: raise SystemExit('DvdDocumentSource method marker missing')
          s = s.replace(old, new, 1)
          old = '''        val plan = DvdIfoParser.selectLongestTitle(vmg) { titleSet ->\n            byName[String.format(Locale.ROOT, "VTS_%02d_0.IFO", titleSet)]?.let(::readEntry)\n        }\n'''
          new = '''        val vtsLoader: (Int) -> ByteArray? = { titleSet ->\n            byName[String.format(Locale.ROOT, "VTS_%02d_0.IFO", titleSet)]?.let(::readEntry)\n        }\n        val plan = if (globalTitle == null) {\n            DvdIfoParser.selectLongestTitle(vmg, vtsLoader)\n        } else {\n            DvdIfoParser.selectTitle(vmg, globalTitle, vtsLoader)\n        }\n'''
          if old not in s: raise SystemExit('DvdDocumentSource plan block missing')
          p.write_text(s.replace(old, new, 1))

          # Runtime: use the exact Beta 1 strategy for title discovery, preserving current remux/Advanced Merger code.
          p = Path('android/app/src/main/java/io/github/maas3n/mattmux/RemuxEngine.kt')
          s = p.read_text()
          start = s.find('    private fun openTitle(context: Context, uri: Uri): NativeTitle {')
          end = s.find('\n    @Suppress("unused")\n    private fun isNativeCancelled()', start)
          if start < 0 or end < 0: raise SystemExit('RemuxEngine openTitle block missing')
          replacement = '''    private fun scanWithDvdNav(stageRoot: java.io.File): Int {\n        val values = nativeScanDvdNav(stageRoot.absolutePath)\n            ?: error("libdvdnav/libdvdread could not scan the staged DVD metadata")\n        require(values.size >= 3) { "libdvdnav scanner returned invalid data" }\n        val count = values[0].toInt()\n        val bestTitle = values[1].toInt()\n        require(count > 0 && bestTitle in 1..count) { "libdvdnav scanner found no usable titles" }\n        android.util.Log.i(\n            "MattMuxDVDNav",\n            "libdvdnav/libdvdread scanned $count title(s); selected title $bestTitle as longest (duration ticks=${values[2]})",\n        )\n        return bestTitle\n    }\n\n    private fun openTitle(context: Context, uri: Uri): NativeTitle {\n        val resolver = context.contentResolver\n        if (DocumentsContract.isTreeUri(uri)) {\n            val stageRoot = DvdNavScanner.stageTreeIfos(context, uri)\n            val bestTitle = try { scanWithDvdNav(stageRoot) } finally { stageRoot.deleteRecursively() }\n            val title = DvdDocumentSource(resolver, uri).openTitle(bestTitle)\n            return NativeTitle(title.plan, title.vobs, cleanup = { title.close() })\n        }\n\n        val handle = resolver.openFileDescriptor(uri, "r")?.use { nativeOpenIso(it.fd) }\n            ?: error("Could not open ISO image")\n        check(handle != 0L) { "Could not open UDF filesystem" }\n        try {\n            val vmg = nativeReadIsoIfo(handle, 0) ?: error("ISO has no VIDEO_TS/VIDEO_TS.IFO")\n            val stageRoot = DvdNavScanner.stageIsoIfos(context, vmg) { titleSet -> nativeReadIsoIfo(handle, titleSet) }\n            val bestTitle = try { scanWithDvdNav(stageRoot) } finally { stageRoot.deleteRecursively() }\n            val plan = DvdIfoParser.selectTitle(vmg, bestTitle) { titleSet ->\n                check(!cancelled.get()) { "Remux cancelled" }\n                nativeReadIsoIfo(handle, titleSet)\n            }\n            return NativeTitle(plan, emptyList(), handle, cleanup = { nativeCloseIso(handle) })\n        } catch (t: Throwable) {\n            nativeCloseIso(handle)\n            throw t\n        }\n    }\n'''
          s = s[:start] + replacement + s[end:]
          marker = '    private external fun nativeVersionSummary(): String\n'
          if marker not in s or 'nativeScanDvdNav' in s:
              raise SystemExit('Unexpected RemuxEngine native method state')
          p.write_text(s.replace(marker, marker + '    private external fun nativeScanDvdNav(path: String): LongArray?\n', 1))

          # JNI: compile DVDNav support only in the final relink, so host tests and the base FFmpeg build still compile cleanly.
          p = Path('android/native/mattmux_jni.c')
          s = p.read_text()
          include_marker = '#include <libavutil/mem.h>\n'
          dvd_include = '#ifdef MATTMUX_DVDNAV\n#include <dvdnav/dvdnav.h>\n#include <android/log.h>\n#endif\n'
          if include_marker not in s or 'dvdnav/dvdnav.h' in s:
              raise SystemExit('Unexpected JNI include state')
          s = s.replace(include_marker, include_marker + dvd_include, 1)
          append = r'''\n\n#ifdef MATTMUX_DVDNAV\nJNIEXPORT jlongArray JNICALL\nJava_io_github_maas3n_mattmux_AndroidNativeRemuxEngine_nativeScanDvdNav(JNIEnv *env, jobject thiz, jstring path_string)\n{\n    (void)thiz;\n    if (!path_string) return NULL;\n    const char *path = (*env)->GetStringUTFChars(env, path_string, NULL);\n    if (!path) return NULL;\n\n    dvdnav_t *nav = NULL;\n    if (dvdnav_open(&nav, path) != DVDNAV_STATUS_OK || !nav) {\n        __android_log_print(ANDROID_LOG_ERROR, "MattMuxDVDNav", "dvdnav_open failed for %s", path);\n        (*env)->ReleaseStringUTFChars(env, path_string, path);\n        if (nav) dvdnav_close(nav);\n        return NULL;\n    }\n    (*env)->ReleaseStringUTFChars(env, path_string, path);\n\n    int32_t title_count = 0;\n    if (dvdnav_get_number_of_titles(nav, &title_count) != DVDNAV_STATUS_OK || title_count <= 0) {\n        __android_log_print(ANDROID_LOG_ERROR, "MattMuxDVDNav", "dvdnav_get_number_of_titles failed");\n        dvdnav_close(nav);\n        return NULL;\n    }\n\n    int32_t best_title = 1;\n    uint64_t best_duration = 0;\n    for (int32_t title = 1; title <= title_count; ++title) {\n        uint64_t *chapter_times = NULL;\n        uint64_t duration = 0;\n        uint32_t chapters = dvdnav_describe_title_chapters(nav, title - 1, &chapter_times, &duration);\n        __android_log_print(ANDROID_LOG_INFO, "MattMuxDVDNav",\n                            "title %d/%d chapters=%u duration_ticks=%llu",\n                            title, title_count, chapters, (unsigned long long)duration);\n        free(chapter_times);\n        if (duration > best_duration) {\n            best_duration = duration;\n            best_title = title;\n        }\n    }\n\n    jlong values[3] = {(jlong)title_count, (jlong)best_title, (jlong)best_duration};\n    jlongArray result = (*env)->NewLongArray(env, 3);\n    if (result) (*env)->SetLongArrayRegion(env, result, 0, 3, values);\n    dvdnav_close(nav);\n    return result;\n}\n#endif\n'''
          p.write_text(s + append)

          # Standard native build now finishes by layering the exact Beta DVDNav scanner onto both ABIs.
          p = Path('android/native/build-ffmpeg-android.sh')
          s = p.read_text()
          old = 'build_abi arm64-v8a aarch64 aarch64-linux-android\nbuild_abi x86_64 x86_64 x86_64-linux-android\n\necho "Bundled LGPL FFmpeg runtime built successfully."\n'
          new = 'build_abi arm64-v8a aarch64 aarch64-linux-android\nbuild_abi x86_64 x86_64 x86_64-linux-android\n\nbash "${SCRIPT_DIR}/build-dvdnav-android.sh"\n\necho "Bundled FFmpeg + libdvdnav/libdvdread runtime built successfully."\n'
          if old not in s: raise SystemExit('build-ffmpeg footer missing')
          s = s.replace(old, new, 1)
          s = s.replace('License mode: LGPL-only dynamic libraries\nGPL enabled: no\nnonfree enabled: no\nBundled GPL DVD libraries: none',
                        'FFmpeg license mode: LGPL-only dynamic libraries\nGPL enabled in FFmpeg: no\nnonfree enabled in FFmpeg: no\nDVD title scanner: libdvdnav 6.1.1 + libdvdread 6.1.3 (GPL; statically linked into JNI)')
          p.write_text(s)

          # Package audit: require the new JNI entry point and the two GPL notices; still reject CSS and codec GPL deps.
          p = Path('android/native/verify-package.py')
          s = p.read_text()
          s = s.replace("r'dvdnav|dvdread|dvdcss|x264|x265|xvid|libav\\w+\\.so\\.'", "r'dvdcss|x264|x265|xvid|libav\\w+\\.so\\.'")
          old = "            dynamic = subprocess.check_output(['readelf', '-dW', str(elf)], text=True)\n            needed = '\\n'.join(line for line in dynamic.splitlines() if '(NEEDED)' in line)\n"
          new = old + "            if lib == 'libmattmux_jni.so':\n                symbols = subprocess.check_output(['readelf', '-Ws', str(elf)], text=True)\n                if 'Java_io_github_maas3n_mattmux_AndroidNativeRemuxEngine_nativeScanDvdNav' not in symbols:\n                    raise SystemExit(f'{filename}: DVDNav JNI scanner entry point missing: {name}')\n"
          if old not in s: raise SystemExit('verify-package dynamic block missing')
          s = s.replace(old, new, 1)
          s = s.replace("for notice in ('COPYING.LGPLv2.1', 'LIBUDFREAD_COPYING.txt', 'ffmpeg-build-info.txt'):",
                        "for notice in ('COPYING.LGPLv2.1', 'LIBUDFREAD_COPYING.txt', 'DVDREAD_COPYING.txt', 'DVDNAV_COPYING.txt', 'ffmpeg-build-info.txt'):")
          p.write_text(s)
          PY

          cat > android/native/FFMPEG_LGPL_POLICY.md <<'EOF'
          # MattMux Android native licensing policy

          MattMux Android/ChromeOS keeps **FFmpeg 9.0.1 itself in an LGPL-only dynamically linked configuration**, while DVD title discovery uses **libdvdnav 6.1.1 + libdvdread 6.1.3**, matching the proven DVDNav Beta 1 scanner design.

          This is an engineering compliance note, not legal advice. libdvdnav and libdvdread are GPL components; the Android package must ship their notices and corresponding source, and redistribution must be reviewed for the GPL obligations created by linking those components into the JNI native library.

          ## Pinned native baseline

          - FFmpeg: 9.0.1, LGPL configuration, GPL/nonfree disabled
          - libudfread: 1.1.2, LGPL-2.1-or-later, separate shared library
          - libdvdnav: 6.1.1, GPL, statically linked into `libmattmux_jni.so`
          - libdvdread: 6.1.3, GPL, statically linked into `libmattmux_jni.so`
          - Android NDK: 30.0.16248370
          - ABIs: `arm64-v8a`, `x86_64`
          - CSS decryption/circumvention: not included

          FFmpeg's `dvdvideo` demuxer remains disabled in the Android FFmpeg build. libdvdnav/libdvdread are used only to inspect staged IFO metadata and choose the longest DVD title. MattMux then converts that selected global title into its existing cell/chapter plan and performs the normal stream-copy remux through libav.

          Every Android release must publish the exact FFmpeg, libudfread, libdvdnav and libdvdread source archives used by CI, retain their license notices, preserve 16 KB ELF alignment, and reject `libdvdcss` and unapproved codec dependencies.
          EOF

          cat > android/native/README.md <<'EOF'
          # Android native remux engine

          MattMux Android/ChromeOS bundles FFmpeg/libav native libraries inside the APK/AAB and supports `arm64-v8a` plus `x86_64`.

          ## Runtime

          - FFmpeg 9.0.1: LGPL-only configuration for probing/remuxing; GPL/nonfree disabled
          - libudfread 1.1.2: UDF/ISO access
          - libdvdnav 6.1.1 + libdvdread 6.1.3: DVD title discovery, using the same longest-title strategy proven by the 1.4.2 DVDNav Beta 1
          - `libmattmux_jni.so`: MattMux JNI bridge; DVDNav/DVDRead are statically linked into this library

          The DVDNav scanner stages only `VIDEO_TS.IFO`/`VTS_nn_0.IFO` metadata into app cache, asks libdvdnav/libdvdread for title count and title durations, selects the longest title, deletes the staging directory, then hands that global title number back to MattMux's existing safe IFO/cell/chapter remux planner.

          This preserves the current 1.4.9 remux engine and Advanced Merger while replacing longest-title discovery with the tested DVDNav Beta behavior. No CSS decryption/circumvention is included.

          Build with:

          ```bash
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          bash android/native/build-ffmpeg-android.sh
          ```

          The build creates source/provenance archives and license assets for FFmpeg, libudfread, libdvdnav and libdvdread and verifies both 64-bit ABIs.
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('THIRD_PARTY.md')
          s = p.read_text()
          old = '''The experimental Android/ChromeOS app uses native FFmpeg libraries and libudfread rather than launching desktop `ffprobe` or MediaInfo subprocesses.\n\n- FFmpeg version: `9.0.1`\n- FFmpeg source SHA-256: `cf38e0e28c7e5605942c4a77755349b0145804a397af37eb1fb4c77cb237f635`\n- libudfread version: `1.1.2`\n- Current target ABIs: `arm64-v8a`, `x86_64`\n\nThe Android build is configured around an LGPL FFmpeg runtime and separately linked LGPL libudfread. Source/provenance and license assets accompany the Alpha 4 release.\n'''
          new = '''The Android/ChromeOS app uses native FFmpeg libraries, libudfread, and the DVD title-discovery pair proven by the 1.4.2 DVDNav Beta 1.\n\n- FFmpeg version: `9.0.1` (LGPL-only FFmpeg configuration)\n- FFmpeg source SHA-256: `cf38e0e28c7e5605942c4a77755349b0145804a397af37eb1fb4c77cb237f635`\n- libudfread version: `1.1.2`\n- libdvdnav version: `6.1.1` (GPL; statically linked into the JNI bridge)\n- libdvdread version: `6.1.3` (GPL; statically linked into the JNI bridge)\n- Current target ABIs: `arm64-v8a`, `x86_64`\n- CSS decryption/circumvention: not included\n\nAndroid releases must include source/provenance and license material for all four native dependencies.\n'''
          if old not in s: raise SystemExit('THIRD_PARTY Android section changed unexpectedly')
          p.write_text(s.replace(old, new, 1))
          PY

          bash -n android/native/build-ffmpeg-android.sh
          bash -n android/native/build-dvdnav-android.sh
          grep -Fq 'nativeScanDvdNav' android/app/src/main/java/io/github/maas3n/mattmux/RemuxEngine.kt
          grep -Fq 'dvdnav_get_number_of_titles' android/native/mattmux_jni.c
          grep -Fq 'dvdnav_describe_title_chapters(nav, title - 1' android/native/mattmux_jni.c

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and native toolchain
        uses: android-actions/setup-android@v3

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils curl patchelf xz-utils autoconf automake libtool pkg-config ffmpeg genisoimage libavformat-dev libavcodec-dev libavutil-dev
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build and verify both ABIs
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" bash android/native/build-ffmpeg-android.sh
          python3 -m pip install pycdlib==1.14.0
          bash android/native/tests/test-udf-source.sh "$PWD/android/native/.work/libudfread"
          bash android/native/tests/test-host-remux.sh "$PWD/android/native/.work/libudfread" "$RUNNER_TEMP/remux-parity"
          gradle -p android -PMATTMUX_VERSION_NAME='1.4.9-dvdnav-check' -PMATTMUX_VERSION_CODE='1049998' :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          python3 android/native/verify-package.py "$APK"
          unzip -p "$APK" assets/ffmpeg/ffmpeg-build-info.txt | grep -Fq 'Title discovery: libdvdnav 6.1.1 + libdvdread 6.1.3'
          unzip -l "$APK" | grep -Fq 'assets/ffmpeg/DVDNAV_COPYING.txt'
          unzip -l "$APK" | grep -Fq 'assets/ffmpeg/DVDREAD_COPYING.txt'
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"

      - name: Commit validated Android-only source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android THIRD_PARTY.md
          git diff --cached --check
          git commit -m 'Port DVDNav title discovery to current Android build'
          git push origin HEAD:main
