name: Rebuild v1.4.9 Android BATCH CLI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-v149-android-batch-cli.yml'

permissions:
  contents: write

env:
  FFMPEG_VERSION: '9.0.1'
  ANDROID_NDK_VERSION: '30.0.16248370'
  SOURCE_COMMIT: '585f5608be63df337e72755611ebe37628cf067f'
  VERSION: '1.4.9'
  VERSION_CODE: '10409999'

jobs:
  rebuild-android-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated Android source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0

      - name: Snapshot Windows and Linux v1.4.9 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.4.9" > /tmp/release-before.json
          jq '[.assets[] | select(.name | test("^(MattMux-1\\.4\\.9-(Windows|Linux)|SHA256SUMS-(Windows|Linux)\\.txt$)")) | {id,name,size,digest,created_at,updated_at}] | sort_by(.name)' \
            /tmp/release-before.json > /tmp/desktop-before.json
          test "$(jq 'length' /tmp/desktop-before.json)" -eq 8
          mkdir -p /tmp/combined-before
          gh release download v1.4.9 --repo "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -D /tmp/combined-before
          grep -E 'Windows|Linux' /tmp/combined-before/SHA256SUMS.txt | LC_ALL=C sort > /tmp/desktop-checksums-before.txt
          test -s /tmp/desktop-checksums-before.txt
          cat /tmp/desktop-before.json
          cat /tmp/desktop-checksums-before.txt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils curl patchelf xz-utils autoconf automake libtool pkg-config ffmpeg genisoimage libavformat-dev libavcodec-dev libavutil-dev
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Require MattMux Android distribution signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/mattmux-upload.jks"
          test -s "${RUNNER_TEMP}/mattmux-upload.jks"

      - name: Build native FFmpeg DVDNav runtime
        run: |
          set -euo pipefail
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            bash android/native/build-ffmpeg-android.sh

      - name: Run native UDF and remux parity tests
        run: |
          set -euo pipefail
          python3 -m pip install pycdlib==1.14.0
          bash android/native/tests/test-udf-source.sh "$PWD/android/native/.work/libudfread"
          bash android/native/tests/test-host-remux.sh "$PWD/android/native/.work/libudfread" "$RUNNER_TEMP/remux-parity"

      - name: Test lint and build signed v1.4.9 APK
        env:
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_STORE_FILE: ${{ runner.temp }}/mattmux-upload.jks
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle -p android \
            -PMATTMUX_VERSION_NAME="$VERSION" \
            -PMATTMUX_VERSION_CODE="$VERSION_CODE" \
            :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Verify BATCH CLI DVDNav ABIs version alignment and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK")"
          grep -Fq "versionCode='$VERSION_CODE'" <<<"$BADGING"
          grep -Fq "versionName='$VERSION'" <<<"$BADGING"
          grep -Fq 'minSdkVersion:26' <<<"$BADGING"
          python3 android/native/verify-package.py "$APK"
          unzip -p "$APK" assets/ffmpeg/ffmpeg-build-info.txt | grep -Fq 'FFmpeg version: 9.0.1'
          unzip -p "$APK" assets/ffmpeg/ffmpeg-build-info.txt | grep -Fq 'libudfread version: 1.1.2'
          unzip -p "$APK" assets/ffmpeg/ffmpeg-build-info.txt | grep -Fq 'Title discovery: libdvdnav 6.1.1 + libdvdread 6.1.3'
          unzip -Z1 "$APK" | grep -Fq 'lib/arm64-v8a/libmattmux_jni.so'
          unzip -Z1 "$APK" | grep -Fq 'lib/x86_64/libmattmux_jni.so'
          grep -Fq 'setIndicator("BATCH")' android/app/src/main/java/io/github/maas3n/mattmux/MainActivity.kt
          grep -Fq 'setIndicator("CLI")' android/app/src/main/java/io/github/maas3n/mattmux/MainActivity.kt
          grep -Fq 'mattmux-cli --batch' android/app/src/main/java/io/github/maas3n/mattmux/MattMuxCli.kt
          grep -Fq 'mattmux-cli scan SOURCE' android/app/src/main/java/io/github/maas3n/mattmux/MattMuxCli.kt
          grep -Fq 'mattmux-cli metadata [--title N] SOURCE' android/app/src/main/java/io/github/maas3n/mattmux/MattMuxCli.kt
          grep -Fq 'mattmux-cli remux [--title N]' android/app/src/main/java/io/github/maas3n/mattmux/MattMuxCli.kt
          grep -Fq 'native libav stream-copy' android/app/src/main/java/io/github/maas3n/mattmux/BatchPanel.kt
          test ! -e android/app/src/main/java/io/github/maas3n/mattmux/DvdIfoParser.kt
          ! grep -R -n 'DvdIfoParser' android/app/src/main/java android/native --exclude-dir=build
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/mattmux-apksigner.txt
          ! grep -Fq 'CN=Android Debug' /tmp/mattmux-apksigner.txt

      - name: Prepare only the Android v1.4.9 replacement assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/android-v149"
          mkdir -p "$stage" "$RUNNER_TEMP/manifests"
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          cp "$APK" "$stage/MattMux-1.4.9-Android.apk"
          git archive --format=tar.gz --prefix=MattMux-1.4.9-Android-Hotfix/ "$SOURCE_COMMIT" android/ \
            > "$stage/MattMux-1.4.9-Android-DVDNav-Source.tar.gz"
          test -s "$stage/MattMux-1.4.9-Android.apk"
          test -s "$stage/MattMux-1.4.9-Android-DVDNav-Source.tar.gz"

          gh release download v1.4.9 --repo "$GITHUB_REPOSITORY" -p SHA256SUMS-Android.txt -D "$RUNNER_TEMP/manifests"
          old_android="$RUNNER_TEMP/manifests/SHA256SUMS-Android.txt"
          grep -Ev '  (MattMux-1\.4\.9-Android\.apk|MattMux-1\.4\.9-Android-DVDNav-Source\.tar\.gz)$' "$old_android" > "$stage/SHA256SUMS-Android.txt"
          (cd "$stage" && sha256sum MattMux-1.4.9-Android.apk MattMux-1.4.9-Android-DVDNav-Source.tar.gz) >> "$stage/SHA256SUMS-Android.txt"

          cp /tmp/combined-before/SHA256SUMS.txt "$stage/SHA256SUMS.txt"
          grep -Ev '  (MattMux-1\.4\.9-Android\.apk|MattMux-1\.4\.9-Android-DVDNav-Source\.tar\.gz|SHA256SUMS-Android\.txt)$' \
            "$stage/SHA256SUMS.txt" > "$stage/SHA256SUMS.txt.new"
          mv "$stage/SHA256SUMS.txt.new" "$stage/SHA256SUMS.txt"
          (cd "$stage" && sha256sum MattMux-1.4.9-Android.apk MattMux-1.4.9-Android-DVDNav-Source.tar.gz SHA256SUMS-Android.txt) >> "$stage/SHA256SUMS.txt"

          grep -E 'Windows|Linux' "$stage/SHA256SUMS.txt" | LC_ALL=C sort > /tmp/desktop-checksums-proposed.txt
          diff -u /tmp/desktop-checksums-before.txt /tmp/desktop-checksums-proposed.txt
          sha256sum "$stage"/*

      - name: Upload Android assets only and update Android release note
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/android-v149"
          gh release upload v1.4.9 --repo "$GITHUB_REPOSITORY" --clobber \
            "$stage/MattMux-1.4.9-Android.apk" \
            "$stage/MattMux-1.4.9-Android-DVDNav-Source.tar.gz" \
            "$stage/SHA256SUMS-Android.txt" \
            "$stage/SHA256SUMS.txt"

          jq -r '.body // ""' /tmp/release-before.json > /tmp/release-body.md
          printf '\n\n### Android / ChromeOS validated libdvdnav update\n\n' >> /tmp/release-body.md
          printf '%s\n' 'The v1.4.9 Android APK has been rebuilt from validated Android source commit `585f5608be63df337e72755611ebe37628cf067f`.' >> /tmp/release-body.md
          printf '%s\n' 'Android DVD title discovery and DVD planning use libdvdnav 6.1.1 + libdvdread 6.1.3 directly; the old MattMux DvdIfoParser path is removed. It keeps native FFmpeg 9.0.1 + libudfread 1.1.2 ISO access, native libav stream-copy remuxing, Advanced Merger with DVD ISO inputs, chapter/stream selection, arm64-v8a + x86_64, Android 8/API 26+, and no CSS decryption/circumvention.' >> /tmp/release-body.md
          printf '%s\n' 'Android BATCH supports DVD VIDEO_TS movie folders and unmounted ISO files. The in-app CLI supports scan, metadata, single-disc remux, and --batch using Android Storage Access Framework content URIs.' >> /tmp/release-body.md
          printf '%s\n' 'No separate FFmpeg CLI executable is bundled because the Android path performs lossless stream-copy directly through native libav.' >> /tmp/release-body.md
          printf '%s\n' 'Windows and Linux v1.4.9 binaries and their platform checksum assets were not rebuilt or modified. The original v1.4.9 tag remains unchanged.' >> /tmp/release-body.md
          gh release edit v1.4.9 --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-body.md

      - name: Prove Windows and Linux release assets are unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.4.9" > /tmp/release-after.json
          jq '[.assets[] | select(.name | test("^(MattMux-1\\.4\\.9-(Windows|Linux)|SHA256SUMS-(Windows|Linux)\\.txt$)")) | {id,name,size,digest,created_at,updated_at}] | sort_by(.name)' \
            /tmp/release-after.json > /tmp/desktop-after.json
          diff -u /tmp/desktop-before.json /tmp/desktop-after.json

          mkdir -p /tmp/combined-after
          gh release download v1.4.9 --repo "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -D /tmp/combined-after
          grep -E 'Windows|Linux' /tmp/combined-after/SHA256SUMS.txt | LC_ALL=C sort > /tmp/desktop-checksums-after.txt
          diff -u /tmp/desktop-checksums-before.txt /tmp/desktop-checksums-after.txt

          stage="$RUNNER_TEMP/android-v149"
          local_apk_sha="$(sha256sum "$stage/MattMux-1.4.9-Android.apk" | awk '{print $1}')"
          remote_apk_sha="$(jq -r '.assets[] | select(.name == "MattMux-1.4.9-Android.apk") | .digest' /tmp/release-after.json | sed 's/^sha256://')"
          test -n "$remote_apk_sha" && test "$local_apk_sha" = "$remote_apk_sha"
          test "$(jq '[.assets[] | select(.name == "MattMux-1.4.9-Android.apk")] | length' /tmp/release-after.json)" -eq 1
          test "$(jq -r '.target_commitish' /tmp/release-after.json)" = '42f5481b3446f974d6a745d1f4989e18d26ceaff'
          echo "Android APK SHA256: $local_apk_sha"
          cat /tmp/desktop-after.json
