name: Publish MattMux v1.4.4 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.4.4-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create exact v1.4.4 tag and dispatch unified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: bbb2dfb0f5ce89d16d1dfa3a3404dc6f65fafa42
          RELEASE_TAG: v1.4.4
        shell: bash
        run: |
          set -euo pipefail

          git cat-file -e "${RELEASE_SHA}^{commit}"

          existing="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          if [[ -n "$existing" ]]; then
            if [[ "$existing" != "$RELEASE_SHA" ]]; then
              echo "${RELEASE_TAG} already exists at ${existing}, expected ${RELEASE_SHA}." >&2
              exit 1
            fi
            echo "${RELEASE_TAG} already points to the expected commit."
          else
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/${RELEASE_TAG}"
            echo "Created ${RELEASE_TAG} at ${RELEASE_SHA}."
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; nothing else to do."
            exit 0
          fi

          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "tag=${RELEASE_TAG}"

          echo "Dispatched the unified release workflow for ${RELEASE_TAG}."
