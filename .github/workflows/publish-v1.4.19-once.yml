name: Publish MattMux v1.4.19 once

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    if: github.event.head_commit.message == 'Bootstrap MattMux v1.4.19 release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Remove bootstrap, create immutable tag, and start unified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v1.4.19'
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; refusing to move it." >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm .github/workflows/publish-v1.4.19-once.yml
          git commit -m 'Remove v1.4.19 release bootstrap'
          git push origin HEAD:main

          git tag "$tag"
          git push origin "$tag"

          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$tag"
