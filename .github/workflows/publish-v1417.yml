name: Publish approved MattMux 1.4.17
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1417.yml']
permissions:
  contents: write
  actions: write
  pull-requests: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 571bb18fd0ae383dfd30d6d41fc86f13381a6252
      - name: Require merged fix and successful platform checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 571bb18fd0ae383dfd30d6d41fc86f13381a6252
          gh api "repos/$GITHUB_REPOSITORY/pulls/55" \
            | jq -e '.merged == true and .head.sha == "571bb18fd0ae383dfd30d6d41fc86f13381a6252"'
          for run in 36339825494 36339825393 36339825383 36339825410; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
              | jq -e '.head_sha == "571bb18fd0ae383dfd30d6d41fc86f13381a6252" and .status == "completed" and .conclusion == "success"'
          done
      - name: Create immutable v1.4.17 tag
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.4.17 >/dev/null 2>&1; then
            echo 'v1.4.17 already exists; refusing to move it.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.4.17 -m 'MattMux 1.4.17: MKV sources and selectable raw-stream Demux on Windows, Linux, and Android'
          git push origin refs/tags/v1.4.17
      - name: Start complete cross-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v1.4.17 -f tag=v1.4.17
