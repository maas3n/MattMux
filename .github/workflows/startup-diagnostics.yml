name: Read captured startup failure
on:
  pull_request:
    paths: ['.github/workflows/startup-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: startup-35-google_apis-MattMux-Android-ChromeOS-dev
          run-id: 36022705602
          github-token: ${{ github.token }}
          path: startup-logs
      - name: Show captured application crash
        run: |
          cat startup-logs/launch.txt
          grep -E 'AndroidRuntime|FATAL|Fatal signal|mattmux|DEBUG   :' startup-logs/logcat.txt
