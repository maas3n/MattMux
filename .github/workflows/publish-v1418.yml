name: Publish approved MattMux 1.4.18
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1418.yml']
permissions:
  contents: write
  actions: write
  pull-requests: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: a7b5696d777a87d7b78b7317133f97c9c8047094
      - name: Require merged fix and successful platform checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a7b5696d777a87d7b78b7317133f97c9c8047094
          gh api "repos/$GITHUB_REPOSITORY/pulls/56" \
            | jq -e '.merged == true and .head.sha == "f5df0fc8f2b3be30bea91ce2cf82537dd0f5725c" and .merge_commit_sha == "a7b5696d777a87d7b78b7317133f97c9c8047094"'
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse f5df0fc8f2b3be30bea91ce2cf82537dd0f5725c^{tree})"
          for run in 36646740769 36646740874 36646740795 36646740985; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
              | jq -e '.head_sha == "f5df0fc8f2b3be30bea91ce2cf82537dd0f5725c" and .status == "completed" and .conclusion == "success"'
          done
      - name: Create immutable v1.4.18 tag
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.4.18 >/dev/null 2>&1; then
            echo 'v1.4.18 already exists; refusing to move it.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.4.18 -m 'MattMux 1.4.18: fix DVD subtitle demux metadata and Android completion'
          git push origin refs/tags/v1.4.18
      - name: Start complete cross-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v1.4.18 -f tag=v1.4.18
