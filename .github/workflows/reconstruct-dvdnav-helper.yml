name: Reconstruct DVDNav beta helper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconstruct-dvdnav-helper.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          cat .github/debug-build-parts/android-v142-debug-part*.b64 | tr -d '\r\n' | base64 --decode > tmp/dvdnav-beta-helper.sh
          bash -n tmp/dvdnav-beta-helper.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/dvdnav-beta-helper.sh
          git commit -m 'Reconstruct DVDNav beta helper for inspection'
          git push origin HEAD:main
