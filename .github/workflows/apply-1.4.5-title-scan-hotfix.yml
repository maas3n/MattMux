name: Apply 1.4.5 title-scan hotfix once

on:
  push:
    branches:
      - hotfix/1.4.5-dvdvideo-title-scan
    paths:
      - '.github/workflows/apply-1.4.5-title-scan-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Apply remaining source changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/linux_core.go')
          text = p.read_text()
          old = '''\tmaxTitle := 99
          \tif !strings.EqualFold(filepath.Ext(src), ".iso") {
          \t\tcount, countErr := ReadDVDTitleCount(src)
          \t\tif countErr != nil {
          \t\t\treturn nil, fmt.Errorf("could not read DVD title table: %w", countErr)
          \t\t}
          \t\tmaxTitle = count
          \t}
          '''
          new = '''\t// FFmpeg's dvdvideo demuxer accepts title numbers 1..99 and uses
          \t// libdvdread/libdvdnav as its source of truth. Deliberately probe the full
          \t// title-number range instead of parsing VIDEO_TS.IFO in MattMux. This keeps
          \t// folder and ISO title discovery on the same libdvdread/libdvdnav path.
          \tmaxTitle := 99
          '''
          if old not in text:
              raise SystemExit('Linux scan block was not found exactly once')
          p.write_text(text.replace(old, new, 1))

          p = Path('src/dvdchapters.go')
          text = p.read_text()
          start = text.index('// ReadDVDTitleCount returns')
          end = text.index('// ReadDVDChapters reads', start)
          p.write_text(text[:start] + text[end:])

          p = Path('src/dvdchapters_test.go')
          text = p.read_text()
          start = text.index('func TestReadDVDTitleCount')
          end = text.index('func TestReadDVDChaptersSimple', start)
          p.write_text(text[:start] + text[end:])
          PY

          gofmt -w src/app_windows_2.go src/linux_core.go src/dvdchapters.go src/dvdchapters_test.go
          if grep -R "ReadDVDTitleCount" -n src; then
            echo 'ReadDVDTitleCount still exists after hotfix' >&2
            exit 1
          fi

      - name: Run focused parser test
        working-directory: src
        run: go test dvdchapters.go dvdchapters_test.go

      - name: Commit source hotfix and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-1.4.5-title-scan-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Use dvdvideo for desktop title scanning'
          git push origin HEAD:hotfix/1.4.5-dvdvideo-title-scan
