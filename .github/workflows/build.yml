name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install FFmpeg for merger integration tests
        run: choco install ffmpeg --no-progress -y

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build Windows GUI
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -buildvcs=false -ldflags "-s -w -H=windowsgui" -o ..\MattMux.exe .
          Copy-Item .\MattMux.exe.manifest ..\MattMux.exe.manifest -Force
          Get-FileHash ..\MattMux.exe -Algorithm SHA256

      - name: Build and smoke-test Windows batch CLI
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=dev" -o ..\mattmux-cli.exe .\cmd\mattmux-cli-windows
          & ..\mattmux-cli.exe --version
          $help = (& ..\mattmux-cli.exe 2>&1 | Out-String)
          if (-not $help.Contains('--batch')) { throw 'batch CLI help missing' }
          Get-FileHash ..\mattmux-cli.exe -Algorithm SHA256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MattMux-windows-amd64
          path: |
            MattMux.exe
            MattMux.exe.manifest
            mattmux-cli.exe
