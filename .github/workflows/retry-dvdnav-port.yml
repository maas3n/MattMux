name: Retry validated DVDNav port

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retry-dvdnav-port.yml'

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: '30.0.16248370'

jobs:
  port-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reuse corrected port script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/port-dvdnav-to-current-android.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line == '      - name: Port exact DVDNav Beta title-selection strategy')
          run_line = next(i for i in range(start + 1, len(workflow)) if workflow[i] == '        run: |')
          end = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name:'))
          body = '\n'.join(line[10:] if line.startswith('          ') else '' for line in workflow[run_line + 1:end]) + '\n'
          body = body.replace(
              "if marker not in s or 'nativeScanDvdNav' in s:\n    raise SystemExit('Unexpected RemuxEngine native method state')",
              "if marker not in s or 'private external fun nativeScanDvdNav' in s:\n    raise SystemExit('Unexpected RemuxEngine native method state')",
          )
          Path('/tmp/port-dvdnav.sh').write_text(body)
          PY
          bash -n /tmp/port-dvdnav.sh
          bash /tmp/port-dvdnav.sh

          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/native/mattmux_jni.c')
          s = p.read_text()
          marker = r'\n\n#ifdef MATTMUX_DVDNAV\nJNIEXPORT jlongArray JNICALL\nJava_io_github_maas3n_mattmux_AndroidNativeRemuxEngine_nativeScanDvdNav'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('Escaped DVDNav JNI block was not found')
          head, tail = s[:pos], s[pos:]
          p.write_text(head + tail.replace(r'\n', '\n'))
          PY
          grep -Fq 'nativeScanDvdNav' android/app/src/main/java/io/github/maas3n/mattmux/RemuxEngine.kt
          grep -Fq 'dvdnav_get_number_of_titles' android/native/mattmux_jni.c
          grep -Fq 'dvdnav_describe_title_chapters(nav, title - 1' android/native/mattmux_jni.c
          bash -n android/native/build-ffmpeg-android.sh
          bash -n android/native/build-dvdnav-android.sh

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils curl patchelf xz-utils autoconf automake libtool pkg-config ffmpeg genisoimage libavformat-dev libavcodec-dev libavutil-dev
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build, test and verify both Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" bash android/native/build-ffmpeg-android.sh
          python3 -m pip install pycdlib==1.14.0
          bash android/native/tests/test-udf-source.sh "$PWD/android/native/.work/libudfread"
          bash android/native/tests/test-host-remux.sh "$PWD/android/native/.work/libudfread" "$RUNNER_TEMP/remux-parity"
          gradle -p android -PMATTMUX_VERSION_NAME='1.4.9-dvdnav-check' -PMATTMUX_VERSION_CODE='1049998' :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          python3 android/native/verify-package.py "$APK"
          unzip -p "$APK" assets/ffmpeg/ffmpeg-build-info.txt | grep -Fq 'Title discovery: libdvdnav 6.1.1 + libdvdread 6.1.3'
          unzip -l "$APK" | grep -Fq 'assets/ffmpeg/DVDNAV_COPYING.txt'
          unzip -l "$APK" | grep -Fq 'assets/ffmpeg/DVDREAD_COPYING.txt'
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"

      - name: Commit validated Android-only source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android THIRD_PARTY.md
          git diff --cached --check
          git commit -m 'Port DVDNav title discovery to current Android build'
          git push origin HEAD:main
