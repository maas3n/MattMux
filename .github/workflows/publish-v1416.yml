name: Publish approved MattMux 1.4.16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1416.yml']
permissions:
  contents: write
  actions: write
  pull-requests: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: 62617a0813e9ccba404eaf4f739657c28d9e1fb4
      - name: Require merged fix and successful platform checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 62617a0813e9ccba404eaf4f739657c28d9e1fb4
          gh api "repos/$GITHUB_REPOSITORY/pulls/54" \
            | jq -e '.merged == true and .head.sha == "62617a0813e9ccba404eaf4f739657c28d9e1fb4"'
          for run in 36281395373 36281395323 36281395504; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
              | jq -e '.head_sha == "62617a0813e9ccba404eaf4f739657c28d9e1fb4" and .status == "completed" and .conclusion == "success"'
          done
      - name: Create immutable v1.4.16 tag
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.4.16 >/dev/null 2>&1; then
            echo 'v1.4.16 already exists; refusing to move it.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.4.16 -m 'MattMux 1.4.16: fix Windows launcher responsiveness and Linux graphics startup'
          git push origin refs/tags/v1.4.16
      - name: Start complete cross-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v1.4.16 -f tag=v1.4.16
