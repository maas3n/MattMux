name: Unified release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing unified release tag (for example v1.4.0 or v1.4.0-alpha.1)'
        required: true
        type: string

permissions:
  contents: read

env:
  FFMPEG_VERSION: '9.0.1'
  ANDROID_NDK_VERSION: '30.0.16248370'

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      android_version_code: ${{ steps.meta.outputs.android_version_code }}
      windows_numeric_version: ${{ steps.meta.outputs.windows_numeric_version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Validate unified release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)\.([0-9]+))?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            echo "Use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-{alpha,beta,rc}.N" >&2
            exit 1
          fi

          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          channel="${BASH_REMATCH[5]:-}"
          sequence="${BASH_REMATCH[6]:-}"

          (( major <= 200 && minor <= 99 && patch <= 99 )) || {
            echo "Version components are too large for the Android versionCode scheme." >&2
            exit 1
          }

          prerelease=false
          stage=999
          if [[ -n "$channel" ]]; then
            sequence=$((10#$sequence))
            (( sequence >= 1 && sequence <= 99 )) || {
              echo "Pre-release sequence must be between 1 and 99." >&2
              exit 1
            }
            prerelease=true
            case "$channel" in
              alpha) stage=$((sequence)) ;;
              beta)  stage=$((200 + sequence)) ;;
              rc)    stage=$((500 + sequence)) ;;
            esac
          fi

          version="${tag#v}"
          android_version_code=$((major * 10000000 + minor * 100000 + patch * 1000 + stage))
          windows_numeric_version="${major}.${minor}.${patch}.0"

          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "android_version_code=$android_version_code"
            echo "windows_numeric_version=$windows_numeric_version"
          } >> "$GITHUB_OUTPUT"

  windows:
    needs: metadata
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Inject tag version into Windows source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.metadata.outputs.version }}'
          $path = '.\src\app_windows.go'
          $text = Get-Content -LiteralPath $path -Raw
          $old = 'appVersion = "1.2.0"'
          if (-not $text.Contains($old)) {
            throw "Windows version declaration changed; update unified release version injection before publishing."
          }
          $text = $text.Replace($old, "appVersion = `"$version`"")
          Set-Content -LiteralPath $path -Value $text -Encoding UTF8 -NoNewline

      - name: Test and build Windows GUI
        shell: pwsh
        working-directory: src
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          go vet ./...
          .\build.ps1

      - name: Prepare pinned bundled runtime tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ffTag = 'autobuild-2026-09-08-23-15'
          $ffAsset = 'ffmpeg-N-126479-g08cd8df29d-win64-gpl-shared.zip'
          $ffManifestSha = 'f64be162403094773397bfcc299a4a059507028afa7563591fd05c17d56b3214'
          $miVersion = '26.05'
          $miAsset = 'MediaInfo_CLI_26.05_Windows_x64.zip'
          $miSha = 'f7f80620ce6d14f4995f0de6f98e3ef18ad29496db01899571152ee3311229f9'
          $work = Join-Path $env:RUNNER_TEMP 'mattmux-bundled-tools'
          $stage = Join-Path $PWD 'packaging\installer\bundled-tools'
          Remove-Item $work,$stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $work,$stage | Out-Null

          function Assert-Sha([string]$Path,[string]$Expected) {
            $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToLowerInvariant()
            if ($got -ne $Expected.ToLowerInvariant()) {
              throw "SHA-256 mismatch for $Path`nExpected: $Expected`nActual:   $got"
            }
          }

          $ffBase = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$ffTag"
          $manifest = Join-Path $work 'checksums.sha256'
          Invoke-WebRequest -UseBasicParsing -Uri "$ffBase/checksums.sha256" -OutFile $manifest
          Assert-Sha $manifest $ffManifestSha
          $manifestText = Get-Content -LiteralPath $manifest -Raw
          $escaped = [regex]::Escape($ffAsset)
          $match = [regex]::Match($manifestText, "(?im)^([0-9a-f]{64})\s+\*?$escaped\s*$")
          if (-not $match.Success) { throw "Verified FFmpeg manifest does not contain $ffAsset" }
          $ffArchiveSha = $match.Groups[1].Value.ToLowerInvariant()
          $ffArchive = Join-Path $work $ffAsset
          Invoke-WebRequest -UseBasicParsing -Uri "$ffBase/$ffAsset" -OutFile $ffArchive
          Assert-Sha $ffArchive $ffArchiveSha

          $ffExtract = Join-Path $work 'ffmpeg'
          Expand-Archive -LiteralPath $ffArchive -DestinationPath $ffExtract -Force
          $ffmpeg = Get-ChildItem $ffExtract -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg) { throw 'ffmpeg.exe missing from verified archive' }
          $ffBin = $ffmpeg.Directory.FullName
          if (-not (Test-Path (Join-Path $ffBin 'ffprobe.exe'))) { throw 'ffprobe.exe missing from verified archive' }
          $ffDest = Join-Path $stage 'ffmpeg-2026-09-08'
          New-Item -ItemType Directory -Force -Path $ffDest | Out-Null
          Copy-Item (Join-Path $ffBin '*') $ffDest -Force

          $miArchive = Join-Path $work $miAsset
          Invoke-WebRequest -UseBasicParsing -Uri "https://mediaarea.net/download/binary/mediainfo/$miVersion/$miAsset" -OutFile $miArchive
          Assert-Sha $miArchive $miSha
          $miExtract = Join-Path $work 'mediainfo'
          Expand-Archive -LiteralPath $miArchive -DestinationPath $miExtract -Force
          $miExe = Get-ChildItem $miExtract -Filter MediaInfo.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $miExe) { throw 'MediaInfo.exe missing from verified archive' }
          $miDest = Join-Path $stage 'mediainfo-26.05'
          New-Item -ItemType Directory -Force -Path $miDest | Out-Null
          Copy-Item $miExe.FullName (Join-Path $miDest 'MediaInfo.exe') -Force

          & (Join-Path $ffDest 'ffmpeg.exe') -hide_banner -demuxers | Select-String dvdvideo
          if ($LASTEXITCODE -ne 0) { throw 'Bundled FFmpeg self-check failed' }

      - name: Build Windows portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.metadata.outputs.version }}'
          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          $stage = Join-Path $PWD "dist\MattMux-$version-Windows-Portable"
          $releaseZip = Join-Path $PWD "dist\MattMux-$version-Windows-Portable.zip"
          $internalZip = Join-Path $PWD "dist\MattMux-$version-Portable.zip"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $releaseZip,$internalZip -Force -ErrorAction SilentlyContinue

          $ffDest = Join-Path $stage 'MattMuxData\tools\ffmpeg-2026-09-08'
          $miDest = Join-Path $stage 'MattMuxData\tools\mediainfo-26.05'
          New-Item -ItemType Directory -Force -Path $ffDest,$miDest | Out-Null

          Copy-Item .\MattMux.exe (Join-Path $stage 'MattMux-Portable.exe') -Force
          Copy-Item .\mattmux-cli.exe (Join-Path $stage 'mattmux-cli.exe') -Force
          Copy-Item .\src\MattMux.exe.manifest (Join-Path $stage 'MattMux-Portable.exe.manifest') -Force
          Copy-Item .\src\MattMux.ico (Join-Path $stage 'MattMux.ico') -Force
          Copy-Item .\THIRD_PARTY.md (Join-Path $stage 'THIRD_PARTY.md') -Force
          Copy-Item .\packaging\installer\bundled-tools\ffmpeg-2026-09-08\* $ffDest -Force
          Copy-Item .\packaging\installer\bundled-tools\mediainfo-26.05\MediaInfo.exe $miDest -Force

          @(
            "MattMux $version Portable",
            "=========================",
            "",
            "Extract this entire folder and run MattMux-Portable.exe.",
            "The included mattmux-cli.exe provides the Windows BATCH command-line mode.",
            "No installer is required and no FFmpeg, FFprobe, or MediaInfo download is required.",
            "",
            "Keep the folder together. Portable settings, logs, and bundled tools are stored under:",
            "  MattMuxData\"
          ) | Set-Content -LiteralPath (Join-Path $stage 'README-PORTABLE.txt') -Encoding UTF8

          $checksumPath = Join-Path $stage 'CHECKSUMS.txt'
          $lines = Get-ChildItem -LiteralPath $stage -File -Recurse |
            Where-Object { $_.FullName -ne $checksumPath } |
            Sort-Object FullName |
            ForEach-Object {
              $rel = $_.FullName.Substring($stage.Length + 1).Replace('\','/')
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $rel"
            }
          $lines | Set-Content -LiteralPath $checksumPath -Encoding ASCII
          Compress-Archive -LiteralPath $stage -DestinationPath $releaseZip -CompressionLevel Optimal

          # The all-in-one builder still consumes the historical internal filename.
          Copy-Item -LiteralPath $releaseZip -Destination $internalZip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer and All-in-One
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.metadata.outputs.version }}'
          $numericVersion = '${{ needs.metadata.outputs.windows_numeric_version }}'
          $issPath = '.\packaging\installer\MattMux.iss'

          $iss = Get-Content -LiteralPath $issPath -Raw
          $needle = 'VersionInfoVersion={#MyAppVersion}.0'
          if (-not $iss.Contains($needle)) {
            throw 'Inno Setup version declaration changed; update unified release workflow.'
          }
          $iss = $iss.Replace($needle, "VersionInfoVersion=$numericVersion")
          Set-Content -LiteralPath $issPath -Value $iss -Encoding UTF8 -NoNewline

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($null -eq $cmd) { throw 'Inno Setup compiler (ISCC.exe) was not found.' }
            $iscc = $cmd.Source
          }

          & $iscc "/DMyAppVersion=$version" $issPath
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed with exit code $LASTEXITCODE" }
          $setup = ".\dist\MattMux-$version-Setup.exe"
          $releaseSetup = ".\dist\MattMux-$version-Windows-Setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Missing installer: $setup" }
          Move-Item -LiteralPath $setup -Destination $releaseSetup -Force

          $aioScript = '.\packaging\all-in-one\Build-AllInOne.ps1'
          $aioMain = '.\packaging\all-in-one\main.go'
          foreach ($path in @($aioScript, $aioMain)) {
            $text = Get-Content -LiteralPath $path -Raw
            if (-not $text.Contains('1.2.0')) {
              throw "Expected historical version marker was not found in $path"
            }
            $text = $text.Replace('1.2.0', $version)
            Set-Content -LiteralPath $path -Value $text -Encoding UTF8 -NoNewline
          }

          & $aioScript
          if ($LASTEXITCODE -ne 0) { throw "All-in-One build failed with exit code $LASTEXITCODE" }
          $aio = ".\dist\MattMux-$version-All-in-One.exe"
          $releaseAio = ".\dist\MattMux-$version-Windows-All-in-One.exe"
          if (-not (Test-Path -LiteralPath $aio)) { throw "Missing All-in-One executable: $aio" }
          Move-Item -LiteralPath $aio -Destination $releaseAio -Force

          Remove-Item ".\dist\MattMux-$version-Portable.zip" -Force -ErrorAction SilentlyContinue

      - name: Create Windows checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.metadata.outputs.version }}'
          $assets = @(
            ".\dist\MattMux-$version-Windows-Setup.exe",
            ".\dist\MattMux-$version-Windows-All-in-One.exe",
            ".\dist\MattMux-$version-Windows-Portable.zip"
          )
          $lines = foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
            $item = Get-Item -LiteralPath $asset
            if ($item.Length -le 0) { throw "Empty release asset: $asset" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            "$hash  $($item.Name)"
          }
          $lines | Set-Content -LiteralPath .\dist\SHA256SUMS-Windows.txt -Encoding ASCII

      - name: Upload Windows release payload
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            dist/MattMux-${{ needs.metadata.outputs.version }}-Windows-Setup.exe
            dist/MattMux-${{ needs.metadata.outputs.version }}-Windows-All-in-One.exe
            dist/MattMux-${{ needs.metadata.outputs.version }}-Windows-Portable.zip
            dist/SHA256SUMS-Windows.txt

  linux:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ cmake ninja-build curl xz-utils file \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Verify Go module metadata
        working-directory: src
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build Linux release payload
        run: |
          set -euo pipefail
          version='${{ needs.metadata.outputs.version }}'
          bash packaging/linux/build-linux-release.sh "$version"
          bash packaging/linux/build-linux-standalone.sh "$version"

      - name: Validate Linux packages
        run: |
          set -euo pipefail
          version='${{ needs.metadata.outputs.version }}'
          deb="dist/linux-release/MattMux-$version-Linux-amd64.deb"
          standalone="dist/linux-release/MattMux-$version-Linux-amd64Standalone"

          dpkg-deb --info "$deb"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb --extract "$deb" "$tmp"
          test -x "$tmp/usr/bin/mattmux"
          test -x "$tmp/usr/bin/mattmux-cli"
          test -x "$tmp/usr/lib/mattmux/ffmpeg-bin/ffmpeg"
          test -x "$tmp/usr/lib/mattmux/ffprobe-bin/ffprobe" || test -x "$tmp/usr/lib/mattmux/ffmpeg-bin/ffprobe"
          test -x "$tmp/usr/lib/mattmux/mediainfo-bin/mediainfo"

          test -x "$standalone"
          file "$standalone" | grep -E 'ELF 64-bit.*x86-64'
          cache="$(mktemp -d)"
          XDG_CACHE_HOME="$cache" "$standalone" --standalone-self-test
          rm -rf "$cache"

      - name: Create Linux checksums
        run: |
          set -euo pipefail
          cd dist/linux-release
          sha256sum ./*.deb ./*.tar.gz ./*Standalone > SHA256SUMS-Linux.txt
          rm -f SHA256SUMS.txt

      - name: Upload Linux release payload
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            dist/linux-release/*.deb
            dist/linux-release/*.tar.gz
            dist/linux-release/*Standalone
            dist/linux-release/SHA256SUMS-Linux.txt

  android:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils curl patchelf xz-utils autoconf automake libtool pkg-config ffmpeg genisoimage libavformat-dev libavcodec-dev libavutil-dev
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Require Android distribution signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'Missing ANDROID_UPLOAD_KEYSTORE_BASE64' >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing ANDROID_UPLOAD_STORE_PASSWORD' >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing ANDROID_UPLOAD_KEY_ALIAS' >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_UPLOAD_KEY_PASSWORD' >&2; exit 1; }

      - name: Prepare Android distribution keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/mattmux-upload.jks"
          test -s "${RUNNER_TEMP}/mattmux-upload.jks"

      - name: Build bundled LGPL FFmpeg runtime
        run: |
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            bash android/native/build-ffmpeg-android.sh

      - name: Test UDF reads and production JNI remux parity
        run: |
          python3 -m pip install pycdlib==1.14.0
          bash android/native/tests/test-udf-source.sh "$PWD/android/native/.work/libudfread"
          bash android/native/tests/test-host-remux.sh "$PWD/android/native/.work/libudfread" "$RUNNER_TEMP/remux-parity"

      - name: Test, lint and build signed versioned APK
        env:
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_STORE_FILE: ${{ runner.temp }}/mattmux-upload.jks
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MATTMUX_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          gradle -p android \
            -PMATTMUX_VERSION_NAME='${{ needs.metadata.outputs.version }}' \
            -PMATTMUX_VERSION_CODE='${{ needs.metadata.outputs.android_version_code }}' \
            :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Verify version and bundled native libraries
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.metadata.outputs.version }}'
          version_code='${{ needs.metadata.outputs.android_version_code }}'
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"

          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK")"
          grep -Fq "versionCode='$version_code'" <<<"$BADGING"
          grep -Fq "versionName='$version'" <<<"$BADGING"

          python3 android/native/verify-package.py "$APK"
          unzip -p "$APK" assets/ffmpeg/ffmpeg-build-info.txt | grep -q 'FFmpeg version: 9.0.1'
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/mattmux-apksigner.txt
          ! grep -Fq "CN=Android Debug" /tmp/mattmux-apksigner.txt

      - name: Prepare Android / ChromeOS release payload
        run: |
          set -euo pipefail
          version='${{ needs.metadata.outputs.version }}'
          mkdir -p dist/android-release
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"

          cp "$APK" "dist/android-release/MattMux-$version-Android.apk"
          cp "$APK" "dist/android-release/MattMux-$version-ChromeOS.apk"
          test -s "dist/android-release/MattMux-$version-Android.apk"
          test -s "dist/android-release/MattMux-$version-ChromeOS.apk"
          cmp --silent "dist/android-release/MattMux-$version-Android.apk" "dist/android-release/MattMux-$version-ChromeOS.apk"
          cp "android/native/.work/ffmpeg-${FFMPEG_VERSION}.tar.xz" "dist/android-release/FFmpeg-${FFMPEG_VERSION}-source.tar.xz"
          cp android/native/.work/libudfread-1.1.2-source.tar.gz dist/android-release/
          cp android/app/src/main/assets/ffmpeg/LIBUDFREAD_COPYING.txt dist/android-release/
          cp android/app/src/main/assets/ffmpeg/ffmpeg-build-info.txt dist/android-release/FFmpeg-build-info.txt
          cp android/app/src/main/assets/ffmpeg/COPYING.LGPLv2.1 dist/android-release/COPYING.LGPLv2.1.txt
          cp android/app/src/main/assets/ffmpeg/FFMPEG_LICENSE.md dist/android-release/

          (
            cd dist/android-release
            sha256sum ./* > SHA256SUMS-Android.txt
          )

      - name: Upload Android / ChromeOS release payload
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          if-no-files-found: error
          path: dist/android-release/*

  publish:
    needs: [metadata, windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Download all platform payloads
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Add project notices and combined checksums
        run: |
          set -euo pipefail
          version='${{ needs.metadata.outputs.version }}'
          cp THIRD_PARTY.md "release-assets/MattMux-$version-THIRD-PARTY.md"

          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.metadata.outputs.tag }}'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists. Published tags/assets are immutable." >&2
            exit 1
          fi

      - name: Publish one cross-platform GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.metadata.outputs.tag }}'
          version='${{ needs.metadata.outputs.version }}'
          prerelease='${{ needs.metadata.outputs.prerelease }}'

          args=(
            release create "$tag"
            release-assets/*
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --target "$(git rev-parse HEAD)"
            --title "MattMux $version"
            --generate-notes
          )
          if [[ "$prerelease" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
