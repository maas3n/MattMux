name: Cleanup obsolete branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-obsolete-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete redundant long-lived branches
        uses: actions/github-script@v8
        with:
          script: |
            const branches = [
              'android-chromeos',
              'linux-support',
              'release-v1.2.0',
              'feature/linux-standalone-dev5',
              'chore/unify-platforms-main'
            ];

            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                core.info(`Deleted ${branch}`);
              } catch (error) {
                if (error.status === 422 || error.status === 404) {
                  core.warning(`Could not delete ${branch}: ${error.message}`);
                } else {
                  throw error;
                }
              }
            }
