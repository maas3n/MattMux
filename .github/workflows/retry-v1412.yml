name: Recover stalled v1.4.12 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retry-v1412.yml']
permissions:
  actions: write
  contents: read
jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Verify finished jobs and recover stalled run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/35088630425"
          gh api "$endpoint/jobs" > /tmp/release-jobs.json
          jq -e '.jobs | length > 0 and all(.status == "completed")' /tmp/release-jobs.json
          jq -e '.jobs | any(.name == "android" and .conclusion == "failure")' /tmp/release-jobs.json
          status="$(gh api "$endpoint" --jq .status)"
          if [ "$status" != completed ]; then
            gh api --method POST "$endpoint/force-cancel"
          fi
          for attempt in $(seq 1 18); do
            if [ "$(gh api "$endpoint" --jq .status)" = completed ]; then
              gh run rerun 35088630425 --failed --repo "$GITHUB_REPOSITORY"
              exit 0
            fi
            sleep 10
          done
          echo "GitHub has not cleared the stale run status" >&2
          exit 1
