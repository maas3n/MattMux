name: Linux

on:
  push:
    branches:
      - main
      - linux-support
  pull_request:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ cmake ninja-build curl xz-utils file \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Resolve Go modules
        working-directory: src
        run: go mod tidy

      - name: Build GUI, CLI, self-contained DEB, tarballs and standalone
        run: |
          set -euo pipefail
          bash packaging/linux/build-linux-release.sh 1.3.0-dev5
          bash packaging/linux/build-linux-standalone.sh 1.3.0-dev5

      - name: Inspect and validate Debian package
        run: |
          set -euo pipefail
          deb='dist/linux-release/MattMux-1.3.0-dev5-Linux-amd64.deb'
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb --extract "$deb" "$tmp"

          test -x "$tmp/usr/bin/mattmux"
          test -x "$tmp/usr/bin/mattmux-cli"
          test -x "$tmp/usr/lib/mattmux/app/mattmux-bin"
          test -x "$tmp/usr/lib/mattmux/app/mattmux-cli-bin"
          test -x "$tmp/usr/lib/mattmux/ffmpeg-bin/ffmpeg"
          test -x "$tmp/usr/lib/mattmux/ffmpeg-bin/ffprobe"
          test -x "$tmp/usr/lib/mattmux/mediainfo-bin/mediainfo"

          # Installing MattMux must never replace the distribution multimedia
          # commands or ship same-named binaries into /usr/bin.
          test ! -e "$tmp/usr/bin/ffmpeg"
          test ! -e "$tmp/usr/bin/ffprobe"
          test ! -e "$tmp/usr/bin/mediainfo"

          # MattMux's launcher may expose its private tools only to its own child
          # process. It must not edit global PATH/configuration or prefer system
          # multimedia tools over the verified bundle.
          grep -F 'PATH="$FFDIR:$MIDIR:$PATH"' "$tmp/usr/bin/mattmux"
          grep -F 'PATH="$FFDIR:$MIDIR:$PATH"' "$tmp/usr/bin/mattmux-cli"
          ! grep -q 'command -v ffmpeg' "$tmp/usr/bin/mattmux"
          ! grep -q 'command -v ffmpeg' "$tmp/usr/bin/mattmux-cli"

          "$tmp/usr/lib/mattmux/ffmpeg-bin/ffmpeg" -hide_banner -demuxers 2>/dev/null | grep dvdvideo
          "$tmp/usr/lib/mattmux/ffmpeg-bin/ffprobe" -version | head -n 1
          "$tmp/usr/lib/mattmux/mediainfo-bin/mediainfo" --Version | head -n 4
          ldd "$tmp/usr/lib/mattmux/mediainfo-bin/mediainfo" || true

      - name: Validate single-file standalone executable
        run: |
          set -euo pipefail
          standalone='dist/linux-release/MattMux-1.3.0-dev5-Linux-amd64Standalone'
          test -x "$standalone"
          file "$standalone" | grep -E 'ELF 64-bit.*x86-64'

          cache="$(mktemp -d)"
          trap 'rm -rf "$cache"' EXIT
          XDG_CACHE_HOME="$cache" "$standalone" --standalone-self-test

          # The single-file build may unpack only inside the invoking user's
          # private cache. It must not write or install system multimedia tools.
          test -x "$cache/mattmux/standalone/"*/mattmux-bin
          test -x "$cache/mattmux/standalone/"*/ffmpeg
          test -x "$cache/mattmux/standalone/"*/ffprobe
          test -x "$cache/mattmux/standalone/"*/mediainfo

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MattMux-Linux-amd64-dev5
          path: |
            dist/linux-release/*.deb
            dist/linux-release/*.tar.gz
            dist/linux-release/*Standalone
            dist/linux-release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish Linux prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/linux-support'
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_HISTORICAL_REFRESH: ${{ contains(github.event.head_commit.message, '[refresh-v1.3.0-dev5]') }}
        run: |
          set -euo pipefail
          tag='v1.3.0-dev5'
          assets=(
            dist/linux-release/MattMux-1.3.0-dev5-Linux-amd64.deb
            dist/linux-release/MattMux-1.3.0-dev5-Linux-amd64Standalone
            dist/linux-release/MattMux-1.3.0-dev5-Linux-amd64.tar.gz
            dist/linux-release/MattMux-1.3.0-dev5-Source.tar.gz
            dist/linux-release/SHA256SUMS.txt
          )
          notes="$(cat <<'EOF'
          Linux amd64 preview with two self-contained options.

          September 11, 2026 audit hotfix rebuild:
          - each remux now uses a unique operation-owned temporary MKV
          - empty/non-regular completed outputs are rejected
          - output finalization checks sync/close errors and never overwrites a destination created by another writer
          - failure/cancellation cleanup only removes the current operation's temporary output
          - native DVD chapter parsing rejects malformed angle-block structures while preserving FFprobe fallback

          The NTSC frame-timing formula is intentionally unchanged pending a separately verified timing contract.

          The .deb installs MattMux and private pinned FFmpeg/FFprobe/MediaInfo under /usr/lib/mattmux without touching system multimedia tools. MattMux-1.3.0-dev5-Linux-amd64Standalone is one directly runnable ELF file containing MattMux plus the same pinned tools; on first run it extracts only into the invoking user cache and changes PATH only for its own process. Existing /usr/bin/ffmpeg, /usr/bin/ffprobe, /usr/bin/mediainfo, alternatives, shell profiles, /etc/environment, and the system PATH remain untouched.
          EOF
          )"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              if [[ "$ALLOW_HISTORICAL_REFRESH" != "true" ]]; then
                echo "$tag points to $tag_sha; this push is $GITHUB_SHA. Historical release left unchanged."
                exit 0
              fi
              echo "Refreshing $tag from $tag_sha to verified hotfix source $GITHUB_SHA"
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
                -f sha="$GITHUB_SHA" -F force=true >/dev/null
              refreshed_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
              test "$refreshed_sha" = "$GITHUB_SHA"
            fi
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" \
              --title 'MattMux 1.3.0-dev5 Linux standalone preview' \
              --prerelease \
              --notes "$notes" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title 'MattMux 1.3.0-dev5 Linux standalone preview' \
              --prerelease \
              --notes "$notes" \
              --repo "$GITHUB_REPOSITORY"
          fi
