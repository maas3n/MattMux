name: Linux

on:
  push:
    branches:
      - main
      - linux-support
  pull_request:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install Fyne build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Resolve Go modules
        working-directory: src
        run: go mod tidy

      - name: Build GUI, CLI, DEB and tarballs
        run: bash packaging/linux/build-linux-release.sh 1.3.0-dev1

      - name: Inspect Debian package
        run: |
          dpkg-deb --info dist/linux-release/mattmux_1.3.0~dev1_amd64.deb
          dpkg-deb --contents dist/linux-release/mattmux_1.3.0~dev1_amd64.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MattMux-Linux-amd64
          path: |
            dist/linux-release/*.deb
            dist/linux-release/*.tar.gz
            dist/linux-release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish Linux prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/linux-support'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v1.3.0-dev1'
          assets=(
            dist/linux-release/mattmux_1.3.0~dev1_amd64.deb
            dist/linux-release/MattMux-1.3.0-dev1-Linux-amd64.tar.gz
            dist/linux-release/MattMux-1.3.0-dev1-Source.tar.gz
            dist/linux-release/SHA256SUMS.txt
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --target linux-support \
              --title 'MattMux 1.3.0-dev1 Linux preview' \
              --prerelease \
              --notes 'Linux preview for Debian/Ubuntu amd64. Includes the MattMux GUI, mattmux-cli, a .deb package, portable tarball, source tarball, and SHA-256 checksums.' \
              --repo "$GITHUB_REPOSITORY"
          fi
