name: Linux

on:
  push:
    branches:
      - main
      - linux-support
  pull_request:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ cmake ninja-build curl xz-utils \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Resolve Go modules
        working-directory: src
        run: go mod tidy

      - name: Build GUI, CLI, bundled-tools DEB and tarballs
        run: bash packaging/linux/build-linux-release.sh 1.3.0-dev2

      - name: Inspect and validate Debian package
        run: |
          set -euo pipefail
          deb='dist/linux-release/mattmux_1.3.0~dev2_amd64.deb'
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb --extract "$deb" "$tmp"

          test -x "$tmp/usr/bin/mattmux"
          test -x "$tmp/usr/bin/mattmux-cli"
          test -x "$tmp/usr/lib/mattmux/ffmpeg-bin/ffmpeg"
          test -x "$tmp/usr/lib/mattmux/ffmpeg-bin/ffprobe"
          test -x "$tmp/usr/lib/mattmux/mediainfo-bin/mediainfo"

          # The package must not replace distribution multimedia commands.
          test ! -e "$tmp/usr/bin/ffmpeg"
          test ! -e "$tmp/usr/bin/ffprobe"
          test ! -e "$tmp/usr/bin/mediainfo"

          "$tmp/usr/lib/mattmux/ffmpeg-bin/ffmpeg" -hide_banner -demuxers 2>/dev/null | grep dvdvideo
          "$tmp/usr/lib/mattmux/ffmpeg-bin/ffprobe" -version | head -n 1
          "$tmp/usr/lib/mattmux/mediainfo-bin/mediainfo" --Version | head -n 4
          ldd "$tmp/usr/lib/mattmux/mediainfo-bin/mediainfo" || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MattMux-Linux-amd64-dev2
          path: |
            dist/linux-release/*.deb
            dist/linux-release/*.tar.gz
            dist/linux-release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish Linux prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/linux-support'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v1.3.0-dev2'
          assets=(
            dist/linux-release/mattmux_1.3.0~dev2_amd64.deb
            dist/linux-release/MattMux-1.3.0-dev2-Linux-amd64.tar.gz
            dist/linux-release/MattMux-1.3.0-dev2-Source.tar.gz
            dist/linux-release/SHA256SUMS.txt
          )
          notes='Linux preview for Debian/Ubuntu amd64. The .deb installs the MattMux GUI and mattmux-cli and now contains private bundled FFmpeg, FFprobe and MediaInfo fallbacks under /usr/lib/mattmux. Existing /usr/bin multimedia tools are not replaced. Compatible system FFmpeg/FFprobe and system MediaInfo remain preferred.'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --target linux-support \
              --title 'MattMux 1.3.0-dev2 Linux bundled-tools preview' \
              --prerelease \
              --notes "$notes" \
              --repo "$GITHUB_REPOSITORY"
          fi
