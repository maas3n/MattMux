name: Linux

on:
  push:
    branches:
      - main
      - linux-support
  pull_request:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ cmake ninja-build curl xz-utils \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Resolve Go modules
        working-directory: src
        run: go mod tidy

      - name: Build GUI, CLI, self-contained DEB and tarballs
        run: bash packaging/linux/build-linux-release.sh 1.3.0-dev4

      - name: Inspect and validate Debian package
        run: |
          set -euo pipefail
          deb='dist/linux-release/MattMux-1.3.0-dev4-Linux-amd64.deb'
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb --extract "$deb" "$tmp"

          test -x "$tmp/usr/bin/mattmux"
          test -x "$tmp/usr/bin/mattmux-cli"
          test -x "$tmp/usr/lib/mattmux/app/mattmux-bin"
          test -x "$tmp/usr/lib/mattmux/app/mattmux-cli-bin"
          test -x "$tmp/usr/lib/mattmux/ffmpeg-bin/ffmpeg"
          test -x "$tmp/usr/lib/mattmux/ffmpeg-bin/ffprobe"
          test -x "$tmp/usr/lib/mattmux/mediainfo-bin/mediainfo"

          # Installing MattMux must never replace the distribution multimedia
          # commands or ship same-named binaries into /usr/bin.
          test ! -e "$tmp/usr/bin/ffmpeg"
          test ! -e "$tmp/usr/bin/ffprobe"
          test ! -e "$tmp/usr/bin/mediainfo"

          # MattMux's launcher may expose its private tools only to its own child
          # process. It must not edit global PATH/configuration or prefer system
          # multimedia tools over the verified bundle.
          grep -F 'PATH="$FFDIR:$MIDIR:$PATH"' "$tmp/usr/bin/mattmux"
          grep -F 'PATH="$FFDIR:$MIDIR:$PATH"' "$tmp/usr/bin/mattmux-cli"
          ! grep -q 'command -v ffmpeg' "$tmp/usr/bin/mattmux"
          ! grep -q 'command -v ffmpeg' "$tmp/usr/bin/mattmux-cli"

          "$tmp/usr/lib/mattmux/ffmpeg-bin/ffmpeg" -hide_banner -demuxers 2>/dev/null | grep dvdvideo
          "$tmp/usr/lib/mattmux/ffmpeg-bin/ffprobe" -version | head -n 1
          "$tmp/usr/lib/mattmux/mediainfo-bin/mediainfo" --Version | head -n 4
          ldd "$tmp/usr/lib/mattmux/mediainfo-bin/mediainfo" || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MattMux-Linux-amd64-dev4
          path: |
            dist/linux-release/*.deb
            dist/linux-release/*.tar.gz
            dist/linux-release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish Linux prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/linux-support'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v1.3.0-dev4'
          assets=(
            dist/linux-release/MattMux-1.3.0-dev4-Linux-amd64.deb
            dist/linux-release/MattMux-1.3.0-dev4-Linux-amd64.tar.gz
            dist/linux-release/MattMux-1.3.0-dev4-Source.tar.gz
            dist/linux-release/SHA256SUMS.txt
          )
          notes='Self-contained Debian/Ubuntu amd64 preview. The .deb bundles pinned Linux FFmpeg, FFprobe and MediaInfo privately under /usr/lib/mattmux and MattMux always uses those verified copies. Installing the package does not install, replace or modify /usr/bin/ffmpeg, /usr/bin/ffprobe, /usr/bin/mediainfo, alternatives, shell profiles, /etc/environment, or the system PATH. The private tool directories are added only to the MattMux child process. Includes the FFprobe/MediaInfo stderr separation fixes and fully pinned MediaInfo source set from dev3.'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Refusing to replace $tag assets: tag points to $tag_sha but this build is $GITHUB_SHA." >&2
              echo "Bump the prerelease version instead of publishing different source under the same tag." >&2
              exit 1
            fi
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title 'MattMux 1.3.0-dev4 self-contained Linux package' \
              --prerelease \
              --notes "$notes" \
              --repo "$GITHUB_REPOSITORY"
          fi
