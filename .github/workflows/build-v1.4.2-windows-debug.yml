name: Build v1.4.2 Windows DEBUG installer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v1.4.2-windows-debug.yml'

permissions:
  contents: write

jobs:
  build-debug:
    if: github.event.head_commit.message == 'build v1.4.2 windows debug installer'
    runs-on: windows-latest
    steps:
      - name: Check out original v1.4.2 source
        uses: actions/checkout@v4
        with:
          ref: 1a2d74b71bbe3982490abe843ce9a62745c4534e
          fetch-depth: 1

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Patch Windows Scan Titles to dvdvideo-only discovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          p = Path('src/app_windows_2.go')
          s = p.read_text(encoding='utf-8')
          old = '''\tmaxTitle := 99
          \tif !strings.EqualFold(filepath.Ext(src), ".iso") {
          \t\tcount, countErr := ReadDVDTitleCount(src)
          \t\tif countErr != nil {
          \t\t\treturn fmt.Errorf("Could not read DVD title table: %w", countErr)
          \t\t}
          \t\tmaxTitle = count
          \t}
          '''
          new = '''\t// DEBUG BUILD: deliberately do not use MattMux ReadDVDTitleCount().
          \t// Probe DVD title numbers through FFprobe's dvdvideo demuxer instead.
          \t// The bundled GPL FFmpeg dvdvideo path is backed by libdvdnav/libdvdread.
          \tconst maxTitle = 99
          \tsetStatus("DEBUG: scanning titles through FFmpeg dvdvideo (libdvdnav/libdvdread)…")
          '''
          if old not in s:
              raise SystemExit('expected ReadDVDTitleCount block was not found')
          s = s.replace(old, new, 1)
          s = s.replace('setStatus(fmt.Sprintf("Scanning DVD title %d of %d…", n, maxTitle))',
                        'setStatus(fmt.Sprintf("DEBUG dvdvideo/libdvdnav/libdvdread: scanning DVD title %d of %d…", n, maxTitle))', 1)
          p.write_text(s, encoding='utf-8', newline='')

          p = Path('src/app_windows.go')
          s = p.read_text(encoding='utf-8')
          old = 'appVersion = "1.2.0"'
          if old not in s:
              raise SystemExit('expected appVersion marker was not found')
          p.write_text(s.replace(old, 'appVersion = "1.4.2-DEBUG"', 1), encoding='utf-8', newline='')
          '@ | python -

          if (Select-String -LiteralPath .\src\app_windows_2.go -Pattern 'ReadDVDTitleCount' -Quiet) {
            throw 'DEBUG scan still references ReadDVDTitleCount'
          }
          if (-not (Select-String -LiteralPath .\src\app_windows_4.go -Pattern '"-f", "dvdvideo"' -Quiet)) {
            throw 'dvdvideo probe path is missing'
          }

      - name: Test and build DEBUG Windows GUI
        shell: pwsh
        working-directory: src
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          go vet ./...
          .\build.ps1

      - name: Prepare original pinned v1.4.2 runtime tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ffTag = 'autobuild-2026-09-08-23-15'
          $ffAsset = 'ffmpeg-N-126479-g08cd8df29d-win64-gpl-shared.zip'
          $ffManifestSha = 'f64be162403094773397bfcc299a4a059507028afa7563591fd05c17d56b3214'
          $miVersion = '26.05'
          $miAsset = 'MediaInfo_CLI_26.05_Windows_x64.zip'
          $miSha = 'f7f80620ce6d14f4995f0de6f98e3ef18ad29496db01899571152ee3311229f9'
          $work = Join-Path $env:RUNNER_TEMP 'mattmux-debug-tools'
          $stage = Join-Path $PWD 'packaging\installer\bundled-tools'
          Remove-Item $work,$stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $work,$stage | Out-Null

          function Assert-Sha([string]$Path,[string]$Expected) {
            $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToLowerInvariant()
            if ($got -ne $Expected.ToLowerInvariant()) { throw "SHA-256 mismatch for $Path`nExpected: $Expected`nActual: $got" }
          }

          $ffBase = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$ffTag"
          $manifest = Join-Path $work 'checksums.sha256'
          Invoke-WebRequest -UseBasicParsing -Uri "$ffBase/checksums.sha256" -OutFile $manifest
          Assert-Sha $manifest $ffManifestSha
          $manifestText = Get-Content -LiteralPath $manifest -Raw
          $escaped = [regex]::Escape($ffAsset)
          $match = [regex]::Match($manifestText, "(?im)^([0-9a-f]{64})\s+\*?$escaped\s*$")
          if (-not $match.Success) { throw "Verified FFmpeg manifest does not contain $ffAsset" }
          $ffArchiveSha = $match.Groups[1].Value.ToLowerInvariant()
          $ffArchive = Join-Path $work $ffAsset
          Invoke-WebRequest -UseBasicParsing -Uri "$ffBase/$ffAsset" -OutFile $ffArchive
          Assert-Sha $ffArchive $ffArchiveSha

          $ffExtract = Join-Path $work 'ffmpeg'
          Expand-Archive -LiteralPath $ffArchive -DestinationPath $ffExtract -Force
          $ffmpeg = Get-ChildItem $ffExtract -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg) { throw 'ffmpeg.exe missing from verified archive' }
          $ffBin = $ffmpeg.Directory.FullName
          if (-not (Test-Path (Join-Path $ffBin 'ffprobe.exe'))) { throw 'ffprobe.exe missing from verified archive' }
          $ffDest = Join-Path $stage 'ffmpeg-2026-09-08'
          New-Item -ItemType Directory -Force -Path $ffDest | Out-Null
          Copy-Item (Join-Path $ffBin '*') $ffDest -Force

          & (Join-Path $ffDest 'ffmpeg.exe') -hide_banner -demuxers | Select-String dvdvideo
          if ($LASTEXITCODE -ne 0) { throw 'Bundled FFmpeg does not expose dvdvideo' }

          $miArchive = Join-Path $work $miAsset
          Invoke-WebRequest -UseBasicParsing -Uri "https://mediaarea.net/download/binary/mediainfo/$miVersion/$miAsset" -OutFile $miArchive
          Assert-Sha $miArchive $miSha
          $miExtract = Join-Path $work 'mediainfo'
          Expand-Archive -LiteralPath $miArchive -DestinationPath $miExtract -Force
          $miExe = Get-ChildItem $miExtract -Filter MediaInfo.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $miExe) { throw 'MediaInfo.exe missing from verified archive' }
          $miDest = Join-Path $stage 'mediainfo-26.05'
          New-Item -ItemType Directory -Force -Path $miDest | Out-Null
          Copy-Item $miExe.FullName (Join-Path $miDest 'MediaInfo.exe') -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build DEBUG setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          $issPath = '.\packaging\installer\MattMux.iss'
          $iss = Get-Content -LiteralPath $issPath -Raw
          $needle = 'VersionInfoVersion={#MyAppVersion}.0'
          if (-not $iss.Contains($needle)) { throw 'Inno Setup version declaration changed' }
          $iss = $iss.Replace($needle, 'VersionInfoVersion=1.4.2.0')
          Set-Content -LiteralPath $issPath -Value $iss -Encoding UTF8 -NoNewline

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($null -eq $cmd) { throw 'ISCC.exe not found' }
            $iscc = $cmd.Source
          }
          & $iscc '/DMyAppVersion=1.4.2-DEBUG' $issPath
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed: $LASTEXITCODE" }

          $built = '.\dist\MattMux-1.4.2-DEBUG-Setup.exe'
          $out = '.\dist\MattMux-1.4.2-Windows-setup-DEBUG.exe'
          if (-not (Test-Path -LiteralPath $built)) { throw "Missing built installer: $built" }
          Move-Item -LiteralPath $built -Destination $out -Force
          Get-FileHash -Algorithm SHA256 -LiteralPath $out | Format-List

      - name: Upload DEBUG installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MattMux-1.4.2-Windows-setup-DEBUG
          if-no-files-found: error
          path: dist/MattMux-1.4.2-Windows-setup-DEBUG.exe

      - name: Attach DEBUG installer to existing v1.4.2 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.4.2 .\dist\MattMux-1.4.2-Windows-setup-DEBUG.exe --clobber --repo maas3n/MattMux
