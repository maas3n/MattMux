name: Publish approved MattMux 1.4.12
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1412.yml']
permissions:
  contents: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fca73a48faba0f707800065b3777326ff9f5980f
      - name: Verify all three CI gates for the release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = fca73a48faba0f707800065b3777326ff9f5980f
          for run in 35087528011 35087528028 35087527986; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > /tmp/mattmux-ci.json
            jq -e '.head_sha == "fca73a48faba0f707800065b3777326ff9f5980f" and .status == "completed" and .conclusion == "success"' /tmp/mattmux-ci.json
          done
      - name: Create immutable v1.4.12 tag
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.4.12 >/dev/null 2>&1; then
            echo "v1.4.12 already exists; refusing to move it." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.4.12 -m 'MattMux 1.4.12: Android CLI stream selection and single-ISO sibling output'
          git push origin refs/tags/v1.4.12
      - name: Start complete cross-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.4.12
